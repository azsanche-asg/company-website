:root {
  --ink: #24272b;
  --muted: #757e8a;
  --line: #e2e6eb;
  --bg: #f6f8fa;
  --blue: #486995;
  --teal: #267975;
  --amber: #926f3c;
  --red: #a44e45;
  --guide: 62px;
  color-scheme: light;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font:
    15px/1.55 Inter,
    system-ui,
    sans-serif;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: #fff;
  padding: 9px 14px;
  border-radius: 6px;
  line-height: 1.35;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
button:hover:not(:disabled) {
  border-color: #91a3b8;
  background: #f6f8fb;
}
button:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}
button.primary {
  background: #292d33;
  border-color: #292d33;
  color: #fff;
}
button.primary:hover:not(:disabled) {
  background: #414954;
}
button.text {
  border: 0;
  background: none;
  padding: 3px 0;
  color: var(--blue);
  text-decoration: underline;
  text-underline-offset: 4px;
}
button.small {
  font-size: 13px;
  padding: 6px 10px;
}
button.quiet {
  border-color: transparent;
  background: none;
  color: var(--muted);
  padding: 4px 0;
  font-size: 12px;
}
button.quiet:hover:not(:disabled) {
  background: none;
  text-decoration: underline;
}
button.icon {
  width: 36px;
  padding: 6px;
}
svg.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid #638bd0;
  outline-offset: 3px;
}
input,
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #d5dce5;
  border-radius: 5px;
}
textarea {
  min-height: 86px;
  resize: vertical;
}
input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--teal);
}
label {
  display: block;
  font-size: 14px;
  font-weight: 550;
  margin-bottom: 7px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 25px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -0.6px;
}
h2 {
  font-size: 17px;
  font-weight: 600;
}
h3 {
  font-size: 15px;
  font-weight: 600;
}
p + p {
  margin-top: 12px;
}
.muted {
  color: var(--muted);
}
.tiny {
  font-size: 12px;
}
.smalltext {
  font-size: 13px;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.stack {
  display: grid;
  gap: 18px;
}
.gap {
  margin-top: 20px;
}
.cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 24px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.full {
  grid-column: 1/-1;
}
.field small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: var(--muted);
}
.example-row {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  align-items: center;
  margin-top: 8px;
  font-size: 11px;
  color: #8a95a5;
}
.example-row button {
  font-size: 12px;
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.cardhead {
  padding: 17px 21px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.cardbody {
  padding: 22px;
}
.cardbody > p {
  font-size: 14px;
}
.cardbody > p + .fields {
  margin-top: 20px;
}

  }

      s.stage = checkpoint;
    }
    render();
    window.scrollTo(0, 0);
  }

  function shell(body, footer = "") {
    const reading = [5, 9].includes(s.stage), platform = [0, 3, 8].includes(s.stage);
    const nav = [
      ["grid", "Deployment", 0],
      ["settings", "Configuration", 1],
      ["shield", "Readiness", 2],
      ["flow", "Routing", 3],
      ["clock", "Warm-up", 4],
      ["image", "Reference review", 5],
      ["activity", "Evidence", 6],
      ["shield", "Policy", 7],
      ["activity", "Monitoring", 10]
    ];
    const role = reading ? ["JW", "Dr Jonas Weber", "Radiologist"] : platform ? ["EC", "Emma Chen", "Integration engineer"] : ["AR", "Dr Amina Rahman", "Clinical AI lead"];
    return `<div id="demo" class="demo"></div><div class="workspace ${reading ? "reading" : platform ? "platform" : "assurance"}"><aside class="sidebar">${platform ? '<span class="brand">' + icon("image") + "Linden Imaging</span>" : brand()}<div class="workspace-card"><strong>Linden Imaging</strong>Chest radiography \xB7 Research</div><div class="navheading">${platform ? "PLATFORM" : "WORKSPACE"}</div>${nav.map(([i, n2, k]) => `<button class="navbtn ${s.stage === k ? "active" : ""}" data-go="${k}" ${allowed(s, k) ? "" : "disabled"}>${icon(i)}${n2}</button>`).join("")}<div class="sidebottom"><button class="navbtn" data-action="help">${icon("help")}Documentation</button><button class="navbtn" data-action="support">${icon("help")}Support</button><div class="user"><span class="avatar">${role[0]}</span><span>${role[1]}<br><span class="muted tiny">${role[2]}</span></span></div></div></aside><main class="main"><div class="topline"><span>${reading ? "Linden Reading" : platform ? "Linden Platform" : "Linden Imaging"} <span class="muted"> / </span> <b>${stages[s.stage]}</b></span><div class="row">${badge(s.active ? "Demo policy active" : s.suspended ? "Policy suspended" : "Research environment", s.active ? "good" : s.suspended ? "warn" : "")}${reading ? '<button class="small" data-action="support">Support</button>' : ""}</div></div>${[0, 1, 4, 5, 8, 9].includes(s.stage) ? '<div class="demo-data-scope">Demo images: NIH ChestX-ray14 \xB7 Benchmark results use separate data <button class="text" data-action="help">Sources &amp; scope</button></div>' : ""}${body}</main>${footer ? `<footer class="footer">${footer}</footer>` : ""}</div>`;
  }
  var title = (h, p, status = "") => `<div class="pagetitle"><div><h1>${h}</h1><p>${p}</p></div>${status}</div>`;
  var foot = (status, buttons) => `<span class="status">${status}</span><div class="row">${buttons}</div>`;
  function deployment() {
    return shell(
      `<div class="content">${title("AI applications", "Manage the models and result policies already connected to your workflow.", badge("1 application \xB7 connected"))}<div class="cols"><div class="stack"><section class="card"><div class="deployment-row"><div class="app-summary"><span class="provider-icon">${icon("image")}</span><div><h2>Chest radiograph analysis</h2><p class="smalltext muted">Pleural effusion \xB7 third-party research model</p></div></div>${badge("Connected", "good")}</div><div class="cardbody"><div class="fields">${kv("Model", "DenseNet121")}${kv("Model training dataset", "CheXpert")}${kv("Finding", "Pleural effusion")}${kv("Demo images", "NIH ChestX-ray14 \xB7 one frontal view per case")}${kv("Destination", "Linden Reading \xB7 AI panel")}</div></div><div class="cardhead"><h2>Result policy</h2>${badge("Unwrapped comparison")}</div><div class="cardbody"><p>Choose the higher-scoring answer for every study. This comparison rule has no deployment-specific risk budget.</p><div class="row gap">${icon("flow")}<span class="smalltext">Study archive \u2192 AI application \u2192 AI finding</span></div><div class="gap">${b("add-guard", icon("shield") + " Add EyeTrustAI guard", "add", false, true)}</div></div></section>${card(
        "NIH example images \xB7 recorded model outputs",
        `<table><thead><tr><th>NIH example</th><th>Views</th><th>AI result</th><th>Delivery</th></tr></thead><tbody>${cases.slice(0, 3).map(
          (c) => `<tr><td>${c.id}</td><td>${c.views.length}</td><td>Effusion ${c.score >= 0.5 ? "present" : "absent"}</td><td>${badge("Delivered")}</td></tr>`
        ).join("")}</tbody></table>`
      )}</div><aside class="stack">${card("Input preview", `<div class="row"><img class="mini-image" src="${images[cases[0].views[0].key]}" alt="NIH ChestX-ray14 research radiograph"><div><strong>${cases[0].id}</strong><p class="smalltext muted">${cases[0].views[0].label}<br>Research dataset</p></div></div><div class="gap">${note("The original images always reach the radiologist, independently of the AI result.")}</div>`)}${card("Integration point", `<p>Place the guard after model output and before a single AI finding is displayed. Keep normal reading and reporting intact.</p>${kv("Transport", "Proposed API adapter")}${kv("Environment", "Local simulation")}`)}</aside></div></div>`
    );
  }
  function configuration() {
    const frozen = s.started, c = u.config;
    return shell(
      `<div class="content">${title("Configure the finding guard", "Chest X-ray \xB7 Pleural-effusion finding guard", badge(frozen ? "Frozen for round " + s.round : u.dirty ? "Unsaved changes" : "Saved", frozen ? "" : "warn"))}<div class="cols"><div class="stack">${card("Deployment scope", `<div class="fields">${field("Deployment name", "site", input("site", c.site, frozen), "Fictional workflow; do not enter patient information.", "site")}${field("Module", "module", select("module", [["effusion", "Chest X-ray \xB7 Pleural effusion"]], "effusion", true), "Fixed task and reference protocol.")}</div><div class="gap">${kv("Model / preprocessing", "densenet121-res224-chex \xB7 frozen")}${kv("Benchmark unit", "Complete study \xB7 all contributing views")}${kv("Benchmark source", "CheXpert-v1.0-small \xB7 archived scores and references")}${kv("Practice images", "NIH ChestX-ray14 \xB7 separate frontal-image examples")}</div>`)}${card("Fixed mistake definition", `<p>The returned answer excludes the expert-reference finding for pleural effusion.</p><p class="muted smalltext">Only \u201Cabsent\u201D when the reference is \u201Cpresent,\u201D or only \u201Cpresent\u201D when it is \u201Cabsent,\u201D counts as a miss. Keeping both possibilities open is an unresolved result.</p><div class="gap">${b("protocol", "Open reference protocol", "protocol")}</div>`)}${card(
        "Error target & single-answer rate",
        `<div class="fields">${field(
          "Reference missed by the answer set",
          "alpha",
          select(
            "alpha",
            [
              [0.01, "1%"],
              [0.025, "2.5%"],
              [0.05, "5% \xB7 primary benchmark"],
              [0.1, "10%"]
            ],
            c.alpha,
            frozen
          ),
          "Across in-scope studies, not just single suggestions.",
          frozen ? "" : "budget"
        )}${field("Minimum single-answer rate", "utility", input("utility", c.utility, frozen, "number"), "% of calibration studies. A preference, not a guarantee.", frozen ? "" : "utility")}</div><div class="gap">${note("No promise of correctness for an individual image. This is expected-risk control, not a 95%-confidence error limit among released answers.")}</div>`
      )}${card("Clinical controls retained", `<div class="stack"><div class="row">${icon("check")}All images remain in the radiologist\u2019s worklist.</div><div class="row">${icon("check")}Existing priorities and urgent-result procedures stay unchanged.</div><div class="row">${icon("check")}Interpretation and final sign-off remain with the radiologist.</div></div>`)}</div><aside class="stack">${card("Module boundary", `<p>One finding on research chest radiographs. Not a full chest diagnosis, autonomous reporting or clearance from human reading.</p>${kv("Permitted AI contribution", "Single suggestion or unresolved")}${kv("Other findings", "Not covered")}${kv("CT / MRI", "Not supported")}`)}${note("Changing the model, mapping, population or reference protocol requires a compatible new evidence round.", "warn")}</aside></div></div>`,
      foot(
        frozen ? "Configuration retained \xB7 not editable in a closed round" : u.dirty ? "Draft settings \xB7 no active permission" : "Saved configuration",
        `${b("save-config", "Save configuration", "save-config", frozen)}${b("test-mapping", "Test study/result mapping", "mapping", !s.config || u.dirty || frozen)}${b("to-readiness", "View readiness \u2192", "readiness", !s.mapping || !frozen && u.dirty, true)}`
      )
    );
  }
  function readiness() {
    return shell(
      `<div class="content">${title("Warm-up readiness", "Check that this workflow can provide compatible scores and reference evidence.", badge(s.qualified ? "Ready for warm-up" : "Checks required", s.qualified ? "good" : "warn"))}${recoveryPanel(s, "imaging")}<div class="cols"><div class="stack">${card(
        "Compatibility checks",
        `<table><thead><tr><th>Requirement</th><th>Expected input</th><th>Status</th></tr></thead><tbody>${[
          ["Study pairing", "All images belong to the same study", s.issue !== "mapping"],
          ["Score mapping", "Effusion output \xB7 study maximum", true],
          ["Frozen scorer", "Model and preprocessing identified", s.issue !== "scorer"],
          ["Reference process", "Study-level expert review", true],
          ["Fallback", "Images and normal reading always continue", true]
        ].map(
          ([a, b2, ok]) => `<tr><td>${a}</td><td>${b2}</td><td>${badge(ok ? "Compatible" : "Needs attention", ok ? "good" : "warn")}</td></tr>`
        ).join("")}</tbody></table>`
      )}${s.issue === "scorer" ? card("Scorer preparation required", `<p>The proposed scorer does not match this module. Continue normal reading while a specialist assesses an appropriate frozen scorer.</p><div class="gap">${b("prepare", "Open preparation request", "support")}</div>`) : s.issue === "mapping" ? note("The test envelope has a mismatched study reference. Repair pairing and test again.", "warn") : note(s.qualified ? "This workflow is compatible with attempting warm-up. Useful calibration is not guaranteed." : "Run the check after reviewing the input test.", "good")}${card(
        "Demonstration controls",
        field(
          "Input scenario",
          "readiness-scenario",
          select(
            "readiness-scenario",
            [
              ["none", "Compatible study and scorer"],
              ["mapping", "Mismatched study reference"],
              ["scorer", "Scorer preparation required"]

            s.issue,
            s.started
          ),
          "These are simulated integration faults, not claims about the underlying images."

        notify("Previous round archived; permission reset.");
        break;
      }
      case "insufficient":
        modal(
          "Insufficient-evidence example",
          `<p>At a 1% budget, even zero misses among 60 calibration studies gives 1/61 = 1.64%, which is too high.</p><p>The correct next step is to plan more suitable evidence, not relax the budget automatically. You can explore this branch by starting a new round and selecting 1%.</p>`
        );
        break;
      case "support":
        modal(
          "Open preparation / support case",
          `<p>Describe a scorer, mapping or reference-collection issue. No email or network request is sent.</p><div class="field"><label for="support-reason">Request description \xB7 required</label><textarea id="support-reason"></textarea>${ex("support")}</div>`,
          "confirm-support",
          "Record request locally"
        );
        break;
      case "confirm-support":
        if (run("support", { reason: document.querySelector("#support-reason").value })) {
          close();
          render();
          notify("Request recorded locally. Not sent.");
        }
        break;
      case "help":
        help();
        break;
      case "archives":
        modal(
          "Previous evidence rounds",
          (s.archives || []).length ? s.archives.map(
            (a2) => `<section class="gap"><h3>Round ${a2.round} \xB7 archived</h3>${kv("Deployment", E(a2.config?.site))}${kv("Policy", E(a2.policy?.id || "Not calibrated"))}${kv("Practice references", Object.keys(a2.reviews).length)}${kv("Demonstration findings", Object.keys(a2.signed).length)}<details><summary>Activity and saved records</summary><pre class="receipt">${E(JSON.stringify(a2, null, 2))}</pre></details></section>`
          ).join("") : "<p>No rounds have been archived in this session.</p>"
        );
        break;
      case "protocol":
        protocol();
        break;
      case "close":
        close();
        break;
      case "home":
        modal(
          "Return to the introduction?",
          `<p>This ends the current practice session. Its drafts and local records will be cleared. Nothing has been sent externally.</p>`,
          "confirm-home",
          "Return to intro"
        );
        break;
      case "confirm-home":
        close();
        reset();
        chooser();
        break;
      case "guidance":
        options.guided = !options.guided;
        drawGuide();
        break;
      case "annotations":
        options.annotated = !options.annotated;
        drawGuide();
        break;
      case "show":
        highlight(true);
        break;
      case "budget-continue":
        u.budgetReviewed = true;
        drawGuide();
        highlight(true);
        break;
      case "previous-action": {
        const list = history.get(scope) || [];
        for (let i = historyIndex - 1; i >= 0; i--) {
          const t = document.querySelector(list[i].target);
          if (t && t.getClientRects().length && !t.disabled) {
            historyIndex = i;
            break;
          }
        }
        drawGuide();
        highlight(true);
        break;
      }
      case "resume":
        historyIndex = (history.get(scope) || []).length - 1;
        drawGuide();
        highlight(true);
        break;
      case "zoom-in":
        viewportState().zoom = Math.min(4, viewportState().zoom + 0.25);
        updateImage();
        break;
      case "zoom-out":
        viewportState().zoom = Math.max(0.5, viewportState().zoom - 0.25);
        updateImage();
        break;
      case "fit":
        Object.assign(viewportState(), { zoom: 1, x: 0, y: 0 });
        updateImage();
        break;
      case "invert":
        viewportState().invert = !viewportState().invert;
        updateImage();
        el.textContent = viewportState().invert ? "Original" : "Invert";
        break;
    }
  });
  dialog.addEventListener("cancel", () => {
    u.modal = false;
    drawGuide();
  });
  window.addEventListener("resize", () => {
    measure();
    highlight();
  });
  window.addEventListener("scroll", () => highlight(), true);
  var params = new URLSearchParams(location.hash.startsWith("#walkthrough?") ? location.hash.slice(13) : location.search);
  if (params.has("guided") || location.hash === "#walkthrough") {
    const cp = Number(params.get("checkpoint")) || 0;
    const safeCheckpoint = [0, 5, 6, 7, 9, 10].includes(cp) ? cp : 0;
    start(params.get("guided") !== "0", params.get("annotated") !== "0", safeCheckpoint, Number(params.get("budget")) || 0.05);
  } else chooser();
})();
