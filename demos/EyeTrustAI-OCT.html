/* OCT image-task workspace; original grayscale research cross-sections. */
.linden-mark {
  display: inline-grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 7px;
  color: white;
  background: #386f73;
  font-size: 17px;
}
.oct-image {
  position: absolute;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.plain-list {
  margin: 0;
  padding-left: 22px;
}
.plain-list li + li {
  margin-top: 10px;
}
.hash {
  overflow-wrap: anywhere;
}
.view-source {
  padding: 13px;
  display: flex;
  gap: 9px;
  flex-wrap: wrap;
  background: #182434;
}
.view-source button {
  background: #24374d;
  border-color: #354b65;
  color: #c2d3e6;
  font-size: 12px;
}
.studylist select {
  background: #142131;
  color: #d1dfed;
  border-color: #36495d;
  font-size: 12px;
  margin-bottom: 8px;
}
.taskbody .field + .field {
  margin-top: 2px;
}
.dialoghead {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  padding: 20px 24px;
  border-bottom: 1px solid var(--line);
}
.dialogbody {
  padding: 24px;
  overflow: auto;
  max-height: calc(82vh - 150px);
}
.dialogactions {
  display: flex;
  justify-content: flex-end;
  gap: 12px;
  padding: 18px 24px;
  border-top: 1px solid var(--line);
}
:root {
  --ink: #24272b;
  --muted: #757e8a;
  --line: #e2e6eb;
  --bg: #f6f8fa;
  --blue: #486995;
  --teal: #267975;
  --amber: #926f3c;
  --red: #a44e45;
  --guide: 62px;
  color-scheme: light;
}
html {
  scroll-padding-top: calc(var(--guide) + 16px);
  scroll-padding-bottom: 95px;
}
* {
  box-sizing: border-box;
}
body {
  margin: 0;
  color: var(--ink);
  background: var(--bg);
  font:
    15px/1.55 Inter,
    system-ui,
    sans-serif;
}
button,
input,
select,
textarea {
  font: inherit;
  color: inherit;
}
button,
a,
input,
select,
textarea {
  -webkit-tap-highlight-color: transparent;
}
button {
  cursor: pointer;
  border: 1px solid var(--line);
  background: #fff;
  padding: 9px 14px;
  border-radius: 6px;
  line-height: 1.35;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
}
button:hover:not(:disabled) {
  border-color: #91a3b8;
  background: #f6f8fb;
}
button:disabled {
  opacity: 0.42;
  cursor: not-allowed;
}
button.primary {
  background: #292d33;
  border-color: #292d33;
  color: #fff;
}
button.primary:hover:not(:disabled) {
  background: #414954;
}
button.text {
  border: 0;
  background: none;
  padding: 3px 0;
  color: var(--blue);
  text-decoration: underline;
  text-underline-offset: 4px;
}
button.small {
  font-size: 13px;
  padding: 6px 10px;
}
button.quiet {
  border-color: transparent;
  background: none;
  color: var(--muted);
  padding: 4px 0;
  font-size: 12px;
}
button.quiet:hover:not(:disabled) {
  background: none;
  text-decoration: underline;
}
button.icon {
  width: 36px;
  padding: 6px;
}
svg.icon {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;
  flex-shrink: 0;
}
button:focus-visible,
a:focus-visible,
input:focus-visible,
select:focus-visible,
textarea:focus-visible {
  outline: 2px solid #638bd0;
  outline-offset: 3px;
}
input,
select,
textarea {
  width: 100%;
  padding: 10px 12px;
  background: #fff;
  border: 1px solid #d5dce5;
  border-radius: 5px;
}
textarea {
  min-height: 86px;
  resize: vertical;
}
input[type="checkbox"] {
  width: 16px;
  height: 16px;
  accent-color: var(--teal);
}
label {
  display: block;
  font-size: 14px;
  font-weight: 550;
  margin-bottom: 7px;
}
h1,
h2,
h3,
p {
  margin: 0;
}
h1 {
  font-size: 25px;
  line-height: 1.35;
  font-weight: 600;
  letter-spacing: -0.6px;
}
h2 {
  font-size: 17px;
  font-weight: 600;
}
h3 {
  font-size: 15px;
  font-weight: 600;
}
p + p {
  margin-top: 12px;
}
.muted {
  color: var(--muted);
}
.tiny {
  font-size: 12px;
}
.smalltext {
  font-size: 13px;
}
.row {
  display: flex;
  align-items: center;
  gap: 12px;
}
.between {
  justify-content: space-between;
}
.wrap {
  flex-wrap: wrap;
}
.stack {
  display: grid;
  gap: 18px;
}
.gap {
  margin-top: 20px;
}
.cols {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 310px;
  gap: 24px;
}
.fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 20px;
}
.full {
  grid-column: 1/-1;
}
.field small {
  display: block;
  margin-top: 5px;
  font-size: 12px;
  color: var(--muted);
}
.example-row {
  display: flex;
  gap: 8px;
  justify-content: flex-end;
  align-items: center;
  margin-top: 8px;
  font-size: 11px;
  color: #8a95a5;
}
.example-row button {
  font-size: 12px;
}
.card {
  background: white;
  border: 1px solid var(--line);
  border-radius: 8px;
  overflow: hidden;
}
.cardhead {
  padding: 17px 21px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.cardbody {
  padding: 22px;
}
.cardbody > p {
  font-size: 14px;
}
.cardbody > p + .fields {
  margin-top: 20px;
}
.notice {
  border: 1px solid #d9e2ed;
  background: #f2f6fa;
  border-radius: 5px;
  padding: 13px 16px;
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 13px;
  color: #4b617e;
}
.notice.warn {
  background: #fcf8f1;
  border-color: #e9dfcc;
  color: #8a6c42;
}
.notice.good {
  background: #f1f7f5;
  border-color: #d6e7e0;
  color: #316b61;
}
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  white-space: nowrap;
  font-size: 11px;
  font-weight: 500;
  line-height: 1.4;
  padding: 4px 7px;
  border: 1px solid #dee4eb;
  border-radius: 4px;
  color: #637083;
  background: #f7f9fb;
}
.badge.good {
  color: #286c62;
  background: #f0f7f5;
  border-color: #dcebe7;
}
.badge.warn {
  color: #9a713b;
  background: #fff8ed;
  border-color: #f0e4d0;
}
.badge.dark {
  background: #223247;
  border-color: #33485e;
  color: #b9cce0;
}
.checkrow {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  font-weight: 400;
}
.checkrow input {
  margin-top: 4px;
  flex-shrink: 0;
}
.kv {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 13px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13px;
}
.kv:last-child {
  border-bottom: 0;
}
.kv span:first-child {
  color: var(--muted);
}
.kv strong {
  text-align: right;
  font-weight: 550;
}
table {
  border-collapse: collapse;
  width: 100%;
  font-size: 13px;
}
th {
  text-align: left;
  font-weight: 500;
  color: #7b8795;
  background: #fafbfd;
  font-size: 12px;
}
th,
td {
  padding: 14px 17px;
  border-bottom: 1px solid var(--line);
}
tbody tr:last-child td {
  border-bottom: 0;
}
.scrolltable {
  overflow: auto;
}
.metrics {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
}
.metric {
  padding: 21px;
  border-right: 1px solid var(--line);
}
.metric:last-child {
  border-right: 0;
}
.metric b {
  display: block;
  font-size: 27px;
  font-weight: 550;
  margin: 6px 0;
}
.metric small {
  font-size: 12px;
  color: var(--muted);
}
.metric label {
  font-size: 12px;
  font-weight: 400;
}
.receipt {
  font:
    12px/1.7 ui-monospace,
    SFMono-Regular,
    monospace;
  color: #405570;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  background: #f7f9fc;
  border: 1px solid var(--line);
  padding: 16px;
  border-radius: 6px;
}
.split-rule {
  margin: 20px 0;
  border: 0;
  border-top: 1px solid var(--line);
}
.chooser {
  max-width: 1060px;
  margin: auto;
  padding: 38px 32px;
}
.brand {
  display: flex;
  align-items: center;
  gap: 9px;
  font-weight: 650;
  font-size: 19px;
  letter-spacing: -0.5px;
}
.brand img {
  width: 26px;
  height: 26px;
}
.chooser .intro {
  margin: 55px 0 30px;
  max-width: 710px;
}
.chooser h1 {
  font-size: 34px;
  margin: 10px 0 15px;
}
.eyebrow {
  font-size: 11px;
  letter-spacing: 1.4px;
  text-transform: uppercase;
  font-weight: 650;
  color: #70849f;
}
.mode-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}
.mode-card {
  text-align: left;
  display: block;
  padding: 24px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: #fff;
}
.mode-card h2 {
  margin: 10px 0;
}
.mode-card p {
  font-size: 14px;
  color: var(--muted);
  min-height: 43px;
}
.mode-card .mode-go {
  display: block;
  margin-top: 20px;
  color: var(--blue);
  font-size: 13px;
  font-weight: 550;
}
.mode-card:first-child {
  border-color: #9cb2ce;
}
.chooser-footer {
  margin-top: 26px;
  display: flex;
  justify-content: space-between;
  gap: 15px;
  flex-wrap: wrap;
  font-size: 12px;
  color: var(--muted);
}
.checkpoint-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
.checkpoint-grid button {
  justify-content: flex-start;
  font-size: 13px;
}
.chooser details {
  margin-top: 26px;
}
summary {
  cursor: pointer;
  color: var(--blue);
  font-size: 13px;
}
.chooser .notice {
  margin-top: 25px;
}
.demo {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  z-index: 50;
  background: #fff;
  border-bottom: 1px solid #dae1e9;
  box-shadow: 0 2px 8px #10203305;
}
.demobar {
  min-height: 61px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 24px;
  gap: 14px;
}
.demobar .brand {
  font-size: 17px;
  border: 0;
  padding: 0;
  background: none;
}
.demobar .brand img {
  width: 23px;
  height: 23px;
}
.demo-title {
  border-left: 1px solid var(--line);
  margin-left: 10px;
  padding-left: 18px;
  font-size: 13px;
  color: #75808c;
  font-weight: 400;
  letter-spacing: 0;
}
.switches {
  display: flex;
  align-items: center;
  gap: 18px;
  font-size: 12px;
}
.switch {
  padding: 0;
  background: none;
  border: 0;
  font-size: 12px;
  gap: 7px;
}
.track {
  height: 17px;
  width: 29px;
  background: #c9cfd5;
  border-radius: 20px;
  position: relative;
}
.track:after {
  content: "";
  position: absolute;
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fff;
  top: 3px;
  left: 3px;
}
.switch[aria-checked="true"] .track {
  background: #252a31;
}
.switch[aria-checked="true"] .track:after {
  left: 15px;
}
.assist {
  display: grid;
  grid-template-columns: 1fr;
}
.assist.both {
  grid-template-columns: minmax(0, 1fr) 34%;
}
.guide {
  display: grid;
  grid-template-columns: 170px minmax(0, 1fr) 120px;
  gap: 20px;
  padding: 18px 24px;
  background: #f5f8fc;
  border-top: 1px solid #e6ebf2;
}
.stagebox {
  display: flex;
  align-items: center;
  gap: 13px;
}
.stage-number {
  font-size: 27px;
  font-weight: 600;
  letter-spacing: -1px;
  line-height: 1.3;
}
.stage-number small {
  display: block;
  font-size: 11px;
  color: #8a93a0;
  letter-spacing: 0;
  font-weight: 400;
}
.stage-label {
  font-size: 13px;
  font-weight: 600;
}
.stage-label small {
  display: block;
  font-size: 11px;
  color: #7d8795;
  font-weight: 400;
  margin-top: 3px;
}
.stage-nav {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  margin-top: 7px;
}
.stage-nav button {
  font-size: 10px;
}
.guide-kicker {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 12px;
  margin-bottom: 7px;
}
.guide-kicker .eyebrow {
  font-size: 10px;
}
.guide-kicker button {
  font-size: 10px;
}
.guide h2 {
  font-size: 15px;
  margin-bottom: 5px;
}
.guide p {
  font-size: 13px;
  color: #64728a;
}
.guide-actions {
  display: grid;
  align-content: center;
  gap: 6px;
}
.guide-actions button {
  font-size: 12px;
  border-color: #b9cbe3;
  color: #46699a;
  background: #fff;
}
.guide-actions button:last-child:not(:first-child) {
  background: #eaf0f9;
}
.revisit {
  font-size: 11px !important;
  color: #886e45 !important;
  margin-top: 8px;
}
.annotation {
  padding: 18px 24px;
  border-left: 1px solid #e6e3dc;
  background: #fdfcf9;
  border-top: 1px solid #eee8dd;
}
.annotation .eyebrow {
  color: #91816b;
  font-size: 10px;
}
.annotation h3 {
  margin: 7px 0 4px;
  font-size: 14px;
}
.annotation p {
  font-size: 12px;
  color: #817b70;
}
.annotation button {
  font-size: 11px;
  color: #8a795f;
}
.annotation .row {
  margin-top: 10px;
}
.only-annotation {
  max-height: 145px;
  overflow: auto;
}
.workspace {
  padding-top: var(--guide);
  min-height: 100vh;
}
.sidebar {
  overflow-y: auto;
  position: fixed;
  top: var(--guide);
  bottom: 0;
  width: 215px;
  background: #fff;
  border-right: 1px solid var(--line);
  display: flex;
  flex-direction: column;
  padding: 24px 15px;
  z-index: 20;
}
.sidebar .brand {
  padding: 0 7px;
  font-size: 19px;
}
.workspace-card {
  margin: 26px 0 20px;
  padding: 13px;
  background: #fafbfd;
  border: 1px solid var(--line);
  border-radius: 7px;
  font-size: 12px;
}
.workspace-card strong {
  display: block;
  font-size: 13px;
}
.navheading {
  font-size: 10px;
  letter-spacing: 1.3px;
  color: #8a94a1;
  margin: 13px 12px 9px;
}
.navbtn {
  display: flex;
  gap: 11px;
  justify-content: flex-start;
  border: 0;
  background: none;
  width: 100%;
  padding: 10px 12px;
  color: #74808e;
  font-size: 13px;
  margin: 2px 0;
}
.navbtn.active {
  background: #edf1f6;
  color: #2e415b;
  font-weight: 550;
}
.sidebottom {
  margin-top: auto;
  border-top: 1px solid var(--line);
  padding-top: 14px;
}
.user {
  padding: 15px 10px 0;
  display: flex;
  gap: 9px;
  font-size: 12px;
}
.avatar {
  background: #edf1f5;
  border: 1px solid #e1e6ec;
  width: 32px;
  height: 32px;
  border-radius: 6px;
  display: grid;
  place-items: center;
  flex-shrink: 0;
  font-size: 11px;
  color: #697b93;
}
.main {
  margin-left: 215px;
  min-width: 0;
  padding-bottom: 84px;
}
.topline {
  height: 60px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  padding: 0 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  font-size: 12px;
  color: #758093;
  gap: 12px;
}
.topline b {
  color: #394656;
  font-weight: 550;
}
.app-stage-nav {
  display: inline-flex;
  gap: 6px;
}
body[data-guidance="true"] .app-stage-nav {
  display: none;
}
.content {
  max-width: 1430px;
  margin: auto;
  padding: 30px 32px;
}
.pagetitle {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 25px;
}
.pagetitle p {
  font-size: 14px;
  color: #7b8490;
  margin-top: 7px;
}
.footer {
  position: fixed;
  bottom: 0;
  right: 0;
  left: 215px;
  min-height: 70px;
  z-index: 24;
  background: #fff;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 15px;
  padding: 14px 32px;
}
.footer .status {
  font-size: 12px;
  color: #778392;
}
.footer .row {
  justify-content: flex-end;
  flex-wrap: wrap;
}
.platform .sidebar {
  background: #f9fbfd;
}
.platform .brand {
  color: #30495f;
}
.provider-icon {
  width: 43px;
  height: 43px;
  background: #eaf1f6;
  border: 1px solid #d7e1eb;
  border-radius: 8px;
  display: grid;
  place-items: center;
  color: #426583;
}
.app-summary {
  display: flex;
  gap: 18px;
  align-items: center;
}
.app-summary h2 {
  font-size: 19px;
  margin-bottom: 4px;
}
.deployment-row {
  padding: 19px 22px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 20px;
}
.connection {
  display: flex;
  align-items: center;
  gap: 10px;
}
.dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: #489387;
}
.pipeline {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 30px 22px;
  overflow: auto;
}
.pipe-node {
  min-width: 150px;
  flex: 1;
  border: 1px solid #d5dfea;
  background: #f9fbfd;
  border-radius: 7px;
  padding: 17px;
  font-size: 13px;
}
.pipe-node strong {
  display: block;
  margin: 9px 0 3px;
}
.pipe-node small {
  color: #7a8798;
  font-size: 11px;
}
.pipe-node.guard {
  border-color: #8fa9c8;
  background: #f0f5fc;
}
.bypass {
  font-size: 12px;
  border: 1px dashed #c3d4cf;
  background: #f4f9f6;
  padding: 12px 17px;
  border-radius: 5px;
  color: #4c7c6b;
  margin: 0 22px 22px;
}
.tabs {
  display: flex;
  gap: 3px;
  border-bottom: 1px solid var(--line);
  padding: 0 16px;
}
.tabs button {
  border: 0;
  background: none;
  border-radius: 0;
  font-size: 13px;
  padding: 13px 16px;
  color: #8390a1;
  border-bottom: 2px solid transparent;
}
.tabs button.selected {
  border-bottom-color: #4c709d;
  color: #385f8d;
}
.test-list {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 18px 0;
}
.test-list button.tested {
  background: #f1f7f5;
  border-color: #9bbeb2;
  color: #397166;
}
.outcomes {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 9px;
}
.outcome {
  justify-content: flex-start;
  font-size: 13px;
  padding: 12px;
}
.outcome.selected {
  background: #ecf5f2;
  border-color: #5a9b8e;
  color: #2f7364;
}
.outcome i {
  width: 11px;
  height: 11px;
  border: 1px solid #b6c2cd;
  border-radius: 50%;
  flex-shrink: 0;
}
.outcome.selected i {
  border: 3px solid #509184;
}
.activity {
  list-style: none;
  margin: 0;
  padding: 0;
}
.activity li {
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
  font-size: 12px;
}
.activity li:last-child {
  border: 0;
}
.reading .main {
  margin-left: 0;
  background: #111923;
  padding-bottom: 0;
}
.reading .sidebar {
  display: none;
}
.reading .topline {
  background: #1b2839;
  color: #a7b8cb;
  border-color: #2d3d50;
  height: 53px;
  padding: 0 20px;
}
.reading .topline b {
  color: #e5edf6;
}
.reading .topline button {
  background: #263b51;
  border-color: #45576d;
  color: #e0eaf4;
}
.reader-grid {
  display: grid;
  grid-template-columns: 205px minmax(0, 1fr) 355px;
  min-height: calc(100vh - var(--guide) - 53px);
  align-items: stretch;
}
.studylist {
  background: #1b2635;
  border-right: 1px solid #314056;
  padding: 15px 10px;
  color: #bfd0df;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.studylist .eyebrow {
  padding: 0 9px;
  color: #8eabc9;
}
.studylist input {
  font-size: 12px;
  padding: 8px;
  background: #142131;
  border-color: #36495d;
  color: #d1dfed;
  margin: 8px 0;
}
.study {
  display: block;
  text-align: left;
  padding: 13px 11px;
  color: #b6c7d8;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  font-size: 12px;
}
.study:hover:not(:disabled) {
  background: #23374c;
  border-color: #3c526a;
}
.study.current {
  background: #29415b;
  border-color: #567793;
  color: #fff;
}
.study span {
  display: block;
  font-size: 10px;
  color: #8fa6bd;
  margin-top: 4px;
}
.study.done:after {
  content: "Reference saved";
  display: block;
  color: #9ccbbd;
  font-size: 10px;
  margin-top: 5px;
}
.studylist .text {
  color: #a9c4e8;
  font-size: 12px;
  margin: 12px 0 0;
}
.view-shell {
  min-width: 0;
  background: #090e14;
  display: flex;
  flex-direction: column;
}
.viewer-toolbar {
  background: #1a2737;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  color: #b5c7dc;
  border-bottom: 1px solid #314055;
}
.viewer-toolbar button {
  padding: 6px 9px;
  background: #24374d;
  border-color: #354b65;
  color: #c2d3e6;
  font-size: 12px;
}
.viewer-toolbar span {
  margin-left: auto;
  font-size: 11px;
  color: #8299b1;
}
.viewport {
  height: clamp(340px, calc(100vh - var(--guide) - 236px), 760px);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  touch-action: none;
  background: #06090d;
  min-width: 0;
}
.viewport.dragging {
  cursor: grabbing;
}
.xray {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center center;
}
.view-overlay {
  position: absolute;
  z-index: 2;
  left: 13px;
  top: 12px;
  color: #afc0d2;
  font:
    11px/1.7 ui-monospace,
    monospace;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}
.view-overlay.bottom {
  top: auto;
  bottom: 12px;
  color: #798c9f;
}
.viewstrip {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #152130;
  border-top: 1px solid #293b50;
  overflow: auto;
}
.view-thumb {
  padding: 4px 7px;
  background: #1d2d41;
  border: 1px solid #3a4c63;
  color: #aebfd4;
  font-size: 10px;
  display: flex;
  gap: 8px;
}
.view-thumb.selected {
  border-color: #9cbedf;
  color: white;
  background: #2c435e;
}
.view-thumb img {
  width: 46px;
  height: 52px;
  object-fit: contain;
  background: #000;
}
.reader-task {
  background: #fbfcfd;
  border-left: 1px solid #324456;
  min-width: 0;
  padding-bottom: 15px;
}
.task-heading {
  padding: 19px 22px;
  border-bottom: 1px solid var(--line);
}
.task-heading h2 {
  margin: 5px 0;
  font-size: 17px;
}
.taskbody {
  padding: 20px;
}
.taskbody label {
  font-size: 13px;
}
.taskbody .outcomes {
  grid-template-columns: 1fr;
}
.taskbody .notice {
  font-size: 12px;
  padding: 12px;
  margin: 16px 0;
}
.taskbody .fields {
  grid-template-columns: 1fr;
}
.taskactions {
  padding: 15px 20px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 9px;
}
.taskactions button {
  width: 100%;
  font-size: 13px;
}
.research-note {
  padding: 12px 17px;
  color: #8da1b9;
  background: #152130;
  font-size: 11px;
  border-top: 1px solid #2d3f53;
}
.finding-card {
  padding: 15px;
  background: #f0f4fa;
  border: 1px solid #d5dfec;
  border-radius: 6px;
  margin: 12px 0;
}
.finding-card h3 {
  color: #435e80;
  font-size: 15px;
  margin-bottom: 7px;
}
.finding-card p {
  font-size: 12px;
  color: #667993;
}
.mini-image {
  width: 95px;
  height: 110px;
  object-fit: contain;
  background: #101923;
  border-radius: 3px;
}
.empty {
  text-align: center;
  padding: 32px;
  color: var(--muted);
  font-size: 14px;
}
#pointer {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 70;
}
#pointer .highlight {
  position: absolute;
  border: 2px solid #567fb2;
  border-radius: 6px;
  box-shadow: 0 0 0 3px #ffffffa8;
}
#pointer .arrow {
  position: absolute;
  font-size: 28px;
  line-height: 1;
  color: #567fb2;
  text-shadow: 0 1px 2px white;
}
#toast {
  position: fixed;
  right: 24px;
  bottom: 88px;
  z-index: 150;
  background: #2d4358;
  color: white;
  max-width: 420px;
  padding: 13px 17px;
  border-radius: 7px;
  box-shadow: 0 5px 25px #0002;
  font-size: 13px;
  display: none;
}
#toast.visible {
  display: block;
}
dialog {
  padding: 0;
  border: 1px solid #d0d8e2;
  border-radius: 10px;
  width: min(680px, calc(100vw - 32px));
  max-height: 82vh;
  color: var(--ink);
  box-shadow: 0 20px 90px #17243833;
}
dialog::backdrop {
  background: #12203566;
}
dialog .dialog-body {
  padding: 25px;
  overflow: auto;
  max-height: calc(82vh - 140px);
}
dialog header {
  padding: 19px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
dialog footer {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background: #fff;
}
dialog p {
  font-size: 14px;
}
dialog .field {
  margin-top: 17px;
}
dialog h3 {
  margin: 19px 0 7px;
}
dialog pre {
  white-space: pre-wrap;
  font-size: 11px;
}
[hidden] {
  display: none !important;
}

cit joint testing plan; the aggregate example provides neither.</p>" : ""}`;

  function shell(body, foot = "", reading = false) {
    const engineer = [0, 2, 3, 8].includes(s.stage), platform = [0, 3, 8].includes(s.stage) || reading;
    const who = reading ? "Priya Shah" : engineer ? "Maya Patel" : "Dr Elena Mart\xEDn";
    const state = s.suspended ? "Suspended" : s.active ? pendingScope(s) ? "Scope uncertain \xB7 simulated" : "Active \xB7 simulated" : s.policy ? "Policy ready \xB7 simulated" : s.started ? "Warm-up" : s.qualified ? "Ready for warm-up" : "Configuration";
    return `<div id="demo" class="demo"></div><div class="workspace ${platform ? "platform" : ""} ${reading ? "reading" : ""}"><aside class="sidebar">${platform ? '<span class="brand"><span class="linden-mark">L</span>Linden Eye</span>' : brand()}<div class="workspace-card"><strong>OCT finding review</strong>Demonstration environment<br>Round ${s.round}</div><div class="navheading">${engineer ? "INTEGRATIONS" : "DEPLOYMENT"}</div>${[
      [0, "Deployments"],
      [1, "Module & controls"],
      [2, "Readiness"],
      [3, "Result routing"],
      [4, "Collection"],
      [6, "Evidence"],
      [7, "Policy"],
      [9, "Finding worklist"],
      [10, "Monitoring"]
    ].map(
      ([n2, t]) => `<button class="navbtn ${s.stage === n2 ? "active" : ""}" data-action="go" data-stage="${n2}" ${allowed(s, n2) ? "" : "disabled"}>${t}</button>`
    ).join(
      ""
    )}<div class="sidebottom"><button class="navbtn" data-action="protocol">Finding protocol</button><button class="navbtn" data-action="support">Support & preparation</button><button class="navbtn" data-action="activity">Activity / archive</button><div class="user"><span class="avatar">${who.split(" ").map((x) => x[0]).slice(0, 2).join(
      ""
    )}</span><span>${who}<br><span class="muted">${reading ? "OCT reviewer" : engineer ? "Platform engineer" : "Clinical service lead"}</span></span></div></div></aside><main class="main"><div class="topline"><span><b>${reading ? "Linden Eye \xB7 OCT review" : platform ? "Linden Eye \xB7 Integrations" : "EyeTrustAI \xB7 Deployment controls"}</b> / ${E(stages[s.stage])}</span><div class="row">${badge(state, s.active ? "good" : s.suspended ? "warn" : "")}<span class="app-stage-nav">${stageNav()}</span>${reading ? b("reader-support", "Support", "support") : ""}</div></div>${reading ? body : `<div class="content"><div class="pagetitle"><div><h1>${E(stages[s.stage])}</h1><p>${E(s.config?.site || "Linden \xB7 OCT finding review")} \xB7 Image-level IRF finding \xB7 ${E(owners[s.stage])}</p></div>${badge("Real OCT images \xB7 Simulated workflow")}</div>${body}</div>`}${foot && !reading ? `<footer class="footer"><span class="status">${E(footerStatus())}</span><div class="row">${foot}</div></footer>` : ""}</main></div>`;
  }
  function footerStatus() {
    return s.suspended ? "Automatic draft insertion suspended \xB7 verification retained" : s.active ? "Simulated routing active \xB7 clinical controls retained" : s.started ? "Warm-up / prepared evidence \xB7 no patient outputs" : s.published ? "Warm-up published \xB7 verification retained" : "Draft deployment \xB7 no automatic draft insertion";
  }
  function stageNav() {
    return `${b("", "\u2190 Previous stage", "previous-stage", s.stage === 0)}${b("", "Next stage \u2192", "next-stage", !allowed(s, s.stage + 1))}`;
  }
  function retained() {
    return card(
      "Controls that stay in place",
      `<ul class="plain-list"><li>Original OCT images and complete-examination checks</li><li>Existing clinical alerts and escalation rules</li><li>Final report review and clinician signature</li><li>Diagnosis, treatment and patient communications</li></ul>${note("One image-level IRF finding\u2014not a whole-eye conclusion or treatment decision.")}`

  }
  function integration() {
    return shell(
      `<div class="stack">${card("OCT AI \xB7 Connected application", `<div class="app-summary"><span class="provider-icon">AI</span><div><h2>Retinal fluid findings</h2><span class="muted">Third-party AI \xB7 Fictional adapter \xB7 Sandbox</span></div></div>${kv("Provider", providerVersion)}${kv("Input", "Single OCT B-scan + image identity")}${kv("Finding schema", "IRF \xB7 Present / Absent in this image")}${kv("Current handling", "Verify every finding before insertion into the draft")}`, badge("Connected \xB7 simulated", "good"))}${card("Finding rules", `<div class="pipeline"><div class="pipe-node"><strong>OCT image</strong><small>Image identity / input profile</small></div><span>\u2192</span><div class="pipe-node"><strong>Existing OCT AI</strong><small>IRF finding proposal</small></div><span>\u2192</span><div class="pipe-node guard"><strong>${s.added ? "EyeTrustAI guard" : "Finding verification"}</strong><small>${s.added ? "Configured separately" : "Current route: every finding"}</small></div><span>\u2192</span><div class="pipe-node"><strong>Draft findings</strong><small>Final clinical review retained</small></div></div><div class="bypass">Raw AI responses remain separate from the preliminary report field. Images and clinical alerts stay available.</div><div class="row between gap"><span class="muted">Control the write to <code>image_findings.IRF</code>.</span>${b("add-guard", s.added ? "Open guard configuration" : "Add finding guard", "add-control", false, true)}</div>`)}${card(

  function configuration() {
    const locked = s.started;
    return shell(
      `<div class="cols"><div class="stack">${card(
        "Deployment scope",
        `<div class="fields">${field("Deployment name", "site", input("site", u.config.site, locked), "", "site")}${field(

          select(
            "source",

            u.config.source,

          "Examination-level findings require different inputs and a compatible module.",

      )}${card("Fixed mistake definition", `<p>An incorrect AI fluid finding enters the preliminary findings panel without the additional verification step.</p><div class="gap">${badge("False absence")} ${badge("False presence")}</div><p class="smalltext muted gap">One binary finding per image. Both false-positive and false-negative proposals count. Final clinical review stays in place.</p>${b("open-protocol", "Open labeling protocol", "protocol")}`)}${card(

      )}</div><aside class="stack">${retained()}${card("Saved configuration", `${kv("State", s.config ? u.dirty ? "Unsaved changes" : "Saved" : "Draft")}${kv("Input pairing", s.mapped ? "Test passed locally" : "Not tested")}${kv("Round", s.round)}${locked ? note("This collection round is frozen. Begin a new round to change scope or limits.") : note("Save first, then test image/result mapping.")}`)}</aside></div>`,

          if (n2) u.selected = n2.id;
          historyScope = "";
          render();
          if (n2 && matchMedia("(max-width: 900px)").matches)
            document.querySelector("#viewport")?.scrollIntoView({ block: "start", behavior: "instant" });
          notify("Practice reference saved. Source labels unchanged.");
        }
        break;
      case "load":
        confirmModal(
          "load",
          "Load a separate synthetic cohort?",
          `<p>Your ${Object.keys(s.labels).length} practice records will be retained and closed for this round. The separate authored scenario is <strong>${E(u.evidenceScenario || "supported")}</strong>. No model is trained and no statistical bound is calculated.</p>`,
          "confirm-load",
          "Load simulated cohort"
        );
        break;
      case "confirm-load":
        if (run("load", {
          scenario: u.evidenceScenario || "supported",
          confirm: document.querySelector("#explicit-confirm").checked
        })) {
          closeModal();
          render();
        }
        break;
      case "assess":
        if (run("assess")) go(7);
        break;
      case "decision-examples":
        u.inspected = true;
        openModal(
          "examples",
          "Prepared policy decisions",
          cases.slice(0, 3).map((c) => {
            const r = route({ ...s, active: true }, c);
            return card(
              c.id,
              `${kv("Simulated provider proposal", c.provider)}${kv("Authored score / threshold", `${c.score} / ${s.policy.threshold}`)}${note(routeNames[r.kind])}<p class="smalltext">${r.reason}</p>`
            );
          }).join('<div class="gap"></div>')
        );
        break;
      case "activate":
        confirmModal(
          "activate",
          "Activate this demo policy?",
          `<p><strong>Simulated certification only.</strong> Activate ${E(s.policy.id)} in this local walkthrough. Keep the 10% audit sample, original image access, encounter checks, existing clinical alerts and final clinical decisions.</p>`,
          "confirm-activate",
          "Activate demo policy"
        );
        break;
      case "confirm-activate":
        if (run("activate", { confirm: document.querySelector("#explicit-confirm").checked })) {
          closeModal();
          render();
        }
        break;
      case "complete-task":
        confirmModal(
          "complete",
          "Save this working finding?",
          `<p>Save the working finding for <strong>${u.selected}</strong>. This does not sign off a patient, send a report or create a referral letter.</p>${kv("Entry", assessed(draft()) ? `IRF ${draft().irf === 1 ? "Present" : "Absent"}` : E(draft().status))}`,
          "confirm-complete",
          "Save local finding"
        );
        break;
      case "confirm-complete":
        if (run("complete", {
          id: u.selected,
          ...draft(),
          confirm: document.querySelector("#explicit-confirm").checked
        })) {
          closeModal();
          render();
        }
        break;
      case "begin-scope-change":
      case "review-scope-change":
      case "acknowledge-recovery":
        run(el.dataset.action, { confirm: true });
        render();
        break;
      case "version-change":
        run("suspend");
        render();
        break;
      case "pause":
        run("suspend", { manual: true });
        render();
        break;
      case "continued-collection":
        confirmModal(
          "round",
          "Plan continued collection?",
          `<p>Begin a new local round, retaining the previous round in the archive. Reconfirm compatible settings and collect further references. No automatic reassessment is performed.</p>`,
          "confirm-round",
          "Begin new round"
        );
        break;
      case "new-round":
        confirmModal(
          "round",
          "Start a new evidence round?",
          `<p>The previous configuration, references, working findings and policy are retained in the local archive. Automatic draft insertion is not carried forward.</p>`,
          "confirm-round",
          "Begin new round"
        );
        break;
      case "confirm-round":
        if (document.querySelector("#explicit-confirm").checked) {
          closeModal();
          s = newRound(s);
          const started = u.started;
          u = freshUI();
          u.started = started;
          historyScope = "";
          render();
        }
        break;
      case "adjudicate":
        u.adjudicateId = el.dataset.id;
        openModal(
          "adjudicate",
          "Separate reference adjudication",
          `<p>${u.adjudicateId} \xB7 Assigned to ${E(s.plan.adjudicator)}.</p><p class="smalltext">Original unresolved reason: ${E(s.labels[u.adjudicateId].reason)}</p><div class="gap">${field(
            "IRF reference",
            "adj-irf",
            select(
              "adj-irf",
              [
                ["", "Choose finding"],
                [1, "Present"],
                [0, "Absent"]
              ],
              ""
            )
          )}</div>${ex("adjudication", "Use dataset reference")}<label class="checkrow gap"><input id="explicit-confirm" type="checkbox">Record this separate practice adjudication.</label>`,
          "save-adjudication",
          "Save adjudication"
        );
        u.adjudicationAssisted = false;
        document.querySelector("#confirm-dialog").disabled = true;
        break;
      case "save-adjudication": {
        const irf = document.querySelector("#adj-irf").value;
        if (run("adjudicate", {
          id: u.adjudicateId,
          status: "assessed",
          irf: irf === "" ? "" : Number(irf),
          assisted: !!u.adjudicationAssisted,
          confirm: document.querySelector("#explicit-confirm").checked
        })) {
          closeModal();
          render();
        }
        break;
      }
      case "support":
        support();
        break;
      case "save-support":
        if (run("support", { reason: `${u.supportType || "preparation"}: ${u.supportText || ""}` })) {
          u.supportText = "";
          closeModal();
          render();
          notify("Local support case recorded. Nothing was sent.");
        }
        break;
      case "audit-example":
        u.selected = "OCT-006";
        u.filter = "all";
        go(9);
        break;
      case "credits":
        credits();
        break;
      case "protocol":
        protocol();
        break;
      case "source-details":
        sourceDetails();
        break;
      case "activity":
        activity();
        break;
      case "receipt":
        receipt();
        break;
      case "zoom-in":
        viewportState().zoom = Math.min(5, viewportState().zoom + 0.25);
        updateImage();
        break;
      case "zoom-out":
        viewportState().zoom = Math.max(0.25, viewportState().zoom - 0.25);
        updateImage();
        break;
      case "native": {
        const box = document.querySelector("#viewport").getBoundingClientRect();
        const c = current();
        Object.assign(viewportState(), {
          zoom: 1 / Math.min(box.width / c.width, box.height / c.height),
          x: 0,
          y: 0
        });
        updateImage();
        break;
      }
      case "fit":
        Object.assign(viewportState(), { zoom: 1, x: 0, y: 0 });
        updateImage();
        break;
      case "confirm-example": {
        const kind = u.pendingExample;
        closeModal();
        fillExample(kind, true);
        break;
      }
      case "restart":
        confirmModal(
          "restart",
          "Restart the walkthrough?",
          `<p>This clears this browser session\u2019s drafts, practice records and local archive. The images, source references and all other demos are unchanged.</p>`,
          "confirm-restart",
          "Return to experience chooser"
        );
        break;
      case "confirm-restart":
        if (document.querySelector("#explicit-confirm").checked) {
          closeModal();
          s = fresh();
          u = freshUI();
          historyScope = "";
          render();
        }
        break;
      case "close":
        closeModal();
        break;
    }
  });
  dialog.addEventListener("cancel", (e) => {
    if (u.modal === "overwrite" && u.exampleReturn) {
      e.preventDefault();
      closeModal();
      return;
    }
    u.modal = null;
    cancelFill();
    setTimeout(drawGuide, 0);
  });
  window.addEventListener("resize", () => {
    measure();
    updateImage();
    highlight(false);
  });
  document.addEventListener("scroll", () => highlight(false), true);
  var params = new URLSearchParams(location.hash.startsWith("#walkthrough?") ? location.hash.slice(13) : location.search);
  if (params.has("guided") || location.hash === "#walkthrough") {
    const cp = Number(params.get("checkpoint")) || 0;
    const safeCheckpoint = [0, 5, 6, 7, 9, 10].includes(cp) ? cp : 0;
    const scenario = ["supported", "insufficient", "no-policy"].includes(params.get("scenario")) ? params.get("scenario") : "supported";
    start(params.get("guided") !== "0", params.get("annotated") !== "0", safeCheckpoint, scenario);
  } else chooser();
})();
