/* OCT image-task workspace; original grayscale research cross-sections. */
.linden-mark {
  display: inline-grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 7px;
  color: white;
  background: #386f73;
  font-size: 17px;
}
.oct-image {
  position: absolute;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.plain-list {
  margin: 0;
  padding-left: 22px;
}
.plain-list li + li {

}

button.icon {

}
svg.icon {

  height: 19px;

  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;

}

}

}
.finding-card {

  border-radius: 6px;

}
.finding-card h3 {
  color: #435e80;
  font-size: 15px;
  margin-bottom: 7px;
}
.finding-card p {
  font-size: 12px;
  color: #667993;
}
.mini-image {
  width: 95px;
  height: 110px;
  object-fit: contain;
  background: #101923;
  border-radius: 3px;
}
.empty {
  text-align: center;
  padding: 32px;
  color: var(--muted);
  font-size: 14px;
}
#pointer {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 70;
}
#pointer .highlight {
  position: absolute;
  border: 2px solid #567fb2;
  border-radius: 6px;
  box-shadow: 0 0 0 3px #ffffffa8;
}
#pointer .arrow {
  position: absolute;
  font-size: 28px;
  line-height: 1;
  color: #567fb2;
  text-shadow: 0 1px 2px white;
}
#toast {
  position: fixed;
  right: 24px;
  bottom: 88px;
  z-index: 150;
  background: #2d4358;
  color: white;

  padding: 13px 17px;
  border-radius: 7px;
  box-shadow: 0 5px 25px #0002;

  display: none;
}
#toast.visible {
  display: block;
}
dialog {
  padding: 0;
  border: 1px solid #d0d8e2;
  border-radius: 10px;

}
dialog .field {

}
dialog h3 {
  margin: 19px 0 7px;
}

}
[hidden] {
  display: none !important;
}

  white-space: pre-wrap;
  overflow-wrap: anywhere;
  font-size: 11px;
  line-height: 1.65;
  max-height: 480px;
  overflow: auto;
  padding: 16px;
}
.field small {
  font-size: 11px;
}
.project-tabs {
  display: flex;
  flex-wrap: wrap;
  border-bottom: 1px solid var(--line);
  gap: 26px;
  color: #79867e;
  font-size: 12px;
  margin-bottom: 20px;
}
.project-tabs > span {
  padding: 8px 0 12px;
}
.project-tabs .selected {
  color: #2c4942;
  border-bottom: 2px solid #5e8073;
}
.model-cover {
  width: 100%;
  height: 225px;
  object-fit: cover;
  border-radius: 6px;
  display: block;
}
.model-meta {
  margin-top: 14px;
}
#add-calibration {
  margin-top: 20px;
  width: 100%;
}
.asset-disclosure {
  display: block;
  text-align: center;
  color: #7d8883;
  font-size: 10px;
  margin-top: 10px;
}
.mapping-fields {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 14px;
  margin-top: 16px;
}
.mapping-fields .field {
  margin: 0 !important;
}
.mapping-fields label {
  font-size: 12px;
}
.mapping-fields select {
  font-size: 12px;
}
.metric-strip {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  background: white;
  border: 1px solid var(--line);
  border-radius: 7px;
  margin-bottom: 18px;
}
.metric-strip > div {
  padding: 18px 20px;
  display: grid;
  gap: 6px;
  border-right: 1px solid var(--line);
}
.metric-strip > div:last-child {
  border: 0;
}
.metric-strip span {
  font-size: 11px;
  color: #64736c;
}
.metric-strip strong {
  font-size: 26px;
  font-weight: 550;
  letter-spacing: -0.5px;
}
.metric-strip small {
  font-size: 10px;
  color: #84928a;
}
.set-chart {
  display: grid;
  gap: 9px;
  margin-top: 20px;
}
.set-chart > div {
  display: grid;
  grid-template-columns: 60px minmax(0, 1fr) 35px;
  gap: 10px;
  align-items: center;
  font-size: 11px;
}
.bar-track {
  background: #e9eeee;
  height: 9px;
  border-radius: 3px;
  overflow: hidden;
}
.bar-track > div {
  height: 100%;
  background: #718d83;
  border-radius: 3px;
}
.explorer-grid {
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
  gap: 20px;
  align-items: start;
}
.explorer-grid > .card {
  margin: 0;
}
.inspection-view {
  background: #1c292d;
  border-radius: 7px;
  overflow: hidden;
}
.viewer-toolbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 13px;
  color: #b7c5c9;
  background: #26343a;
  font-size: 10px;
}
.viewer-toolbar button {
  font-size: 11px;
  padding: 5px 8px;
  min-width: 28px;
  background: #34464b;
  border-color: #496067;
  color: #dbe4e6;
}
.viewport {
  position: relative;
  overflow: hidden;
  background: #1d292e;
  height: 350px;
  min-height: 180px;
  touch-action: none;
  cursor: grab;
}
#vision-image {
  position: absolute;
  width: 100%;
  height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}
.viewer-bottom {
  display: flex;
  justify-content: space-between;
  gap: 8px;
  padding: 8px 13px;
  color: #9cacb0;
  background: #26343a;
  font-size: 9px;
}
.review-caption {
  background: #fff;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-top: 0;
  font-size: 11px;
  border-radius: 0 0 6px 6px;
  color: #65746c;
}
.review-caption strong {
  color: #354841;
  font-weight: 550;
}
.review-caption p {
  margin: 5px 0 10px;
}
.review-intro {
  padding: 10px 0 16px;
  font-size: 12px;
  color: #64776b;
}
.review-grid {
  display: grid;
  grid-template-columns: 170px minmax(240px, 1fr) 285px;
  gap: 14px;
  align-items: start;
}
.review-queue {
  padding: 12px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
}
.review-queue input,
.review-queue select {
  font-size: 11px;
  margin-bottom: 10px;
  padding: 8px;
}
.filmstrip {
  display: grid;
  gap: 7px;
  max-height: 570px;
  overflow: auto;
}
.film {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 6px;
  text-align: left;
  justify-content: start;
  border: 1px solid #e4eae7;
}
.film img {
  width: 54px;
  height: 48px;
  object-fit: cover;
  border-radius: 3px;
}
.film span {
  font-size: 10px;
}
.film small {
  display: block;
  font-size: 9px;
  color: #74827a;
}
.film.selected {
  border-color: #4f8570;
  background: #eef5ef;
}
.reference-panel {
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
  overflow: hidden;
}
.panel-heading {
  padding: 15px;
  border-bottom: 1px solid var(--line);
  display: grid;
  gap: 7px;
  justify-items: start;
}
.panel-heading h2 {
  font-size: 14px;
}
.panel-body {
  padding: 15px;
}
.panel-body .field {
  margin-bottom: 13px;
}
.panel-body label {
  font-size: 12px;
}
.panel-body select,
.panel-body textarea {
  font-size: 12px;
}
.panel-body button {
  font-size: 12px;
}
.assisted {
  color: #8a784d;
}
.review-image,
.review-queue,
.reference-panel {
  min-width: 0;
}
.example-selector {
  display: flex;
  gap: 9px;
  overflow: auto;
  margin-bottom: 20px;
  padding: 2px 2px 9px;
}
.example-selector button {
  flex-shrink: 0;
  padding: 6px 10px 6px 6px;
  gap: 9px;
  font-size: 10px;
  text-align: left;
}
.example-selector img {
  width: 58px;
  height: 45px;
  object-fit: cover;
  border-radius: 3px;
}
.example-selector small {
  display: block;
  font-size: 9px;
  color: #788a80;
}
.example-selector .selected {
  border-color: #4d806b;
  background: #eef4ee;
}
.output-compare {
  display: grid;
  grid-template-columns: 0.8fr 1.2fr;
  gap: 16px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 18px;
  margin-bottom: 20px;
}
.output-compare > div {
  display: grid;
  align-content: start;
  gap: 10px;
}
.output-compare strong {
  font-size: 20px;
  font-weight: 550;
}
.label-set {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}
.label-set > span {
  background: #edf3ec;
  border: 1px solid #c9d9cc;
  color: #3c6250;
  border-radius: 4px;
  font-size: 14px;
  padding: 6px 9px;
}
.score-bars {
  display: grid;
  gap: 12px;
  margin: 20px 0;
}
.score-bars > div {
  display: grid;
  grid-template-columns: 95px minmax(0, 1fr) 43px 48px;
  gap: 8px;
  font-size: 11px;
  align-items: center;
}
.score-bars .bar-track > div {
  background: #b4bdc0;
}
.score-bars .bar-track .included {
  background: #6c8c79;
}
.score-bars small {
  font-size: 9px;
  color: #819089;
}
.preview-controls {
  display: grid;
  grid-template-columns: 1fr 1fr auto;
  gap: 18px;
  align-items: end;
  margin-bottom: 20px;
  padding: 18px;
  background: #fff;
  border: 1px solid var(--line);
  border-radius: 6px;
}
.preview-controls label {
  font-size: 12px;
}
.preview-controls button {
  align-self: end;
  margin-bottom: 0;
}
.preview-controls select {
  font-size: 12px;
}
.consumer-output {
  padding: 22px;
  background: #f7f9f6;
  border: 1px solid #dce5dc;
  border-radius: 6px;
  margin: 16px 0;
  display: grid;
  gap: 16px;
}
.consumer-output p {
  font-size: 12px;
  color: #627365;
}
.consumer-output small {
  font-size: 10px;
  color: #7e8a80;
  overflow-wrap: anywhere;
}
.tabs button[aria-pressed="true"] {
  border-bottom: 2px solid #5c836c;
  color: #365743;
  background: #eef4ef;
}
.outcome-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 25px;
}
.outcome-grid h3 {
  font-size: 13px;
  margin-bottom: 8px;
}
.outcome-grid p {
  font-size: 12px;
  color: #6c7d72;
}
.mobile-review-tabs {
  display: none;
}
.forge-chooser {
  max-width: 1180px;
}
.forge-chooser .intro {
  margin: 45px 0 28px;
}
.forge-chooser h1 {
  font-size: 36px;
  line-height: 1.2;
  letter-spacing: -1px;
}
.forge-chooser .intro > p {
  max-width: 650px;
  font-size: 15px;
}
.chooser-preview {
  display: flex;
  gap: 26px;
  align-items: center;
  background: #edf2ee;
  border: 1px solid #dce5dd;
  border-radius: 9px;
  padding: 17px;
  margin-top: 28px;
}
.chooser-preview img {
  width: 180px;
  height: 130px;
  object-fit: cover;
  border-radius: 6px;
}
.chooser-preview small {
  font-size: 10px;
  color: #7a8b80;
}
.chooser-preview p {
  font-size: 12px;
  color: #617464;
  margin: 9px 0 5px;
}
.before-after {
  display: flex;
  gap: 18px;
  align-items: center;
  font-size: 20px;
  margin-top: 8px;
  color: #3b5343;
}
.before-after i {
  font-style: normal;
  color: #8a9e8e;
  padding: 0 4px;
}
.chooser-preview .eyebrow {
  font-size: 9px;
}
.forge-chooser .mode-card {
  padding: 22px;
}
.forge-chooser .mode-card h2 {
  font-size: 16px;
}
.forge-chooser .mode-card p {
  font-size: 12px;
}
.forge-chooser .notice {
  font-size: 12px;
}
@media (min-width: 1500px) {
  .review-grid {
    grid-template-columns: 190px minmax(0, 1fr) 320px;
  }
  .viewport {
    height: 430px;
  }
}
@media (max-width: 1200px) {
  .review-grid {
    grid-template-columns: 135px minmax(200px, 1fr) 260px;
    gap: 10px;
  }
  .film img {
    width: 38px;
    height: 38px;
  }
  .film {
    padding: 4px;
    gap: 5px;
  }
  .content {
    padding: 22px 20px 110px;
  }
  .viewer-toolbar {
    flex-wrap: wrap;
  }
  .viewport {
    height: 310px;
  }
  .score-bars > div {
    grid-template-columns: 85px minmax(0, 1fr) 38px;
  }
  .score-bars small {
    display: none;
  }
  .preview-controls {
    grid-template-columns: 1fr 1fr;
  }
  .preview-controls button {
    grid-column: 1/-1;
  }
}
@media (max-width: 1050px) {
  .two-col,
  .lab-grid,
  .explorer-grid {
    grid-template-columns: 1fr;
  }
  .review-grid {
    grid-template-columns: 140px minmax(0, 1fr);
  }
  .reference-panel {
    grid-column: 1/-1;
  }
  .panel-body {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
  }
  .panel-body .field {
    margin: 0;
  }
  .panel-body .notice,
  .panel-body > .smalltext {
    grid-column: 1/-1;
  }
  .metric-strip {
    grid-template-columns: 1fr 1fr;
  }
  .metric-strip > div {
    border-bottom: 1px solid var(--line);
  }
  .viewport {
    height: 380px;
  }
  .guide {
    gap: 12px;
  }
  .guide p {
    font-size: 11px;
  }
}
@media (max-width: 640px) {
  .content {
    padding: 18px 14px 135px;
  }
  .sidebar {
    display: none;
  }
  .main {
    margin-left: 0;
  }
  .footer {
    left: 0;
    gap: 8px;
  }
  .footer .status {
    font-size: 10px;
  }
  .footer .row {
    flex-wrap: wrap;
  }
  .footer button {
    font-size: 12px;
    padding: 9px 11px;
  }
  .pagetitle h1 {
    font-size: 21px;
  }
  .demo-disclosure {
    font-size: 8px;
  }
  .topline {
    padding: 10px 14px;
    min-height: 50px;
    flex-wrap: wrap;
    gap: 7px;
  }
  .topline > .row {
    gap: 8px;
  }
  .cardbody {
    padding: 15px;
  }
  .cardhead {
    padding: 13px 15px;
  }
  .mapping-fields {
    grid-template-columns: 1fr;
  }
  .mapping-fields label {
    font-size: 12px;
  }
  .metric-strip > div {
    padding: 13px;
  }
  .metric-strip strong {
    font-size: 22px;
  }
  .metric-strip small {
    font-size: 9px;
  }
  .kv strong {
    max-width: 62%;
  }
  .table-scroll table {
    min-width: 430px;
  }
  .review-grid {
    display: block;
  }
  .mobile-review-tabs {
    display: flex;
    gap: 8px;
    margin-bottom: 12px;
  }
  .mobile-review-tabs button {
    flex: 1;
    font-size: 12px;
  }
  .mobile-review-tabs button[aria-pressed="true"] {
    background: #e6efe8;
    border-color: #789881;
  }
  .review-grid[data-tab="queue"] .review-image,
  .review-grid[data-tab="queue"] .reference-panel,
  .review-grid[data-tab="image"] .review-queue,
  .review-grid[data-tab="image"] .reference-panel,
  .review-grid[data-tab="reference"] .review-queue,
  .review-grid[data-tab="reference"] .review-image {
    display: none;
  }
  .panel-body {
    display: block;
  }
  .panel-body .field {
    margin-bottom: 15px;
  }
  .filmstrip {
    grid-template-columns: 1fr 1fr;
    max-height: none;
  }
  .film img {
    width: 50px;
    height: 45px;
  }
  .viewport {
    height: 280px;
  }
  .viewer-bottom {
    font-size: 8px;
  }
  .preview-controls {
    grid-template-columns: 1fr;
    gap: 12px;
    padding: 14px;
  }
  .outcome-grid {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .score-bars > div {
    grid-template-columns: 92px minmax(0, 1fr) 40px;
  }
  .output-compare {
    grid-template-columns: 1fr;
    gap: 15px;
  }
  .guide {
    padding: 12px 14px;
  }
  .guide p {
    font-size: 11px;
  }
  .annotation p {
    display: block;
    font-size: 10px;
    max-height: 44px;
    overflow: auto;
  }
  .assist.both .annotation {
    padding: 8px 14px;
  }
  .annotation .row {
    margin: 0;
  }
  .annotation h3 {
    font-size: 12px;
  }
  .annotation p {
    margin: 3px 0;
  }
  .guide h2 {
    font-size: 13px;
  }
  .demobar {
    gap: 5px;
  }
  .demobar .brand {
    font-size: 13px;
  }
  .switches {
    gap: 9px;
  }
  .switches button {
    font-size: 10px;
  }
  .chooser-preview {
    display: block;
    padding: 14px;
  }
  .chooser-preview img {
    width: 100%;
    height: 160px;
    margin-bottom: 14px;
  }
  .forge-chooser h1 {
    font-size: 28px;
  }
  .before-after {
    font-size: 18px;
  }
  .forge-chooser .intro {
    margin: 28px 0;
  }
  .mode-grid {
    gap: 12px;
  }
  .forge-chooser .mode-card {
    padding: 18px;
  }
  .chooser-footer {
    align-items: start;
  }
  .label-set > span {
    font-size: 13px;
  }
}
@media (prefers-reduced-motion: reduce) {
  * {
    scroll-behavior: auto !important;
    animation: none !important;
    transition: none !important;
  }
}
.forge .sidebar .brand {
  color: #e2ece6;
}
.reviewspace .pagetitle {
  margin-bottom: 8px;
}
.reviewspace .pagetitle h1 {
  font-size: 20px;
}
.reviewspace .pagetitle p {
  display: none;
}
.reviewspace .content {
  padding-top: 15px;
}
.reviewspace .review-intro {
  padding: 0 0 10px;
}
@media (min-width: 1051px) and (max-height: 850px) {
  .reviewspace .viewport {
    height: 250px;
  }
  .reviewspace .filmstrip {
    max-height: 360px;
  }
  .reviewspace .panel-body {
    max-height: 420px;
    overflow: auto;
  }
  .reviewspace .pagetitle .eyebrow {
    display: none;
  }
  .reviewspace .pagetitle h1 {
    font-size: 18px;
  }
  .reviewspace .review-caption {
    padding: 10px 12px;
  }
  .reviewspace .review-intro button {
    padding: 5px 9px;
    font-size: 11px;
  }
}
/* Voltara's model and engineering workspaces. */
:root {
  --ink: #203443;
  --accent: #257d78;
}
.voltara-mark {
  display: inline-grid;
  place-items: center;
  width: 27px;
  height: 27px;
  background: #d6a64f;
  color: #162c3d;
  font-size: 20px;
  font-weight: 800;
  clip-path: polygon(0 0, 100% 0, 83% 100%, 17% 100%);
}
.voltara .sidebar {
  background: #172d40;
}
.voltara .navbtn.active {
  background: #ffffff17;
  color: #f2cd8c;
  border-left-color: #d9ae66;
}
.voltara .navbtn:not(:disabled):hover {
  background: #ffffff12;
}
.voltara .brand {
  letter-spacing: 0.07em;
  font-size: 15px;
}
.voltara .workspace-card {
  border-color: #ffffff25;
}
.voltara .avatar {
  background: #bd914f;
  color: #142c3d;
}
.voltara-chooser h1 {
  font-size: clamp(29px, 3.2vw, 45px);
  letter-spacing: -1.5px;
  line-height: 1.17;
}
.voltara-chooser .intro {
  padding-bottom: 25px;
}
.engineering-preview {
  display: grid;
  grid-template-columns: 1fr 260px;
  background: #f2f6f5;
  border: 1px solid #dae4e0;
  border-radius: 14px;
  overflow: hidden;
  margin-top: 26px;
}
.preview-story {
  padding: 27px 34px;
}
.preview-pair {
  display: flex;
  gap: 45px;
  margin: 20px 0;
}
.preview-pair > div {
  flex: 1;
  min-width: 0;
}
.preview-pair small {
  display: block;
  color: #5f737e;
}
.preview-pair strong {
  font-size: 45px;
  letter-spacing: -2px;
}
.preview-pair strong span {
  font-size: 22px;
  color: #71818a;
}
.mini-interval {
  height: 5px;
  width: 95%;
  background: #81b2a9;
  position: relative;
  margin: 8px 0 15px;
}
.mini-interval.narrow {
  width: 38%;
  margin-left: 29%;
}
.mini-interval i {
  position: absolute;
  width: 12px;
  height: 12px;
  border-radius: 100%;
  background: #193447;
  top: -4px;
  left: calc(50% - 6px);
}
.preview-side {
  padding: 28px;
  background: #1c3345;
  color: #edf4f4;
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.preview-side > span {
  font-size: 10px;
  letter-spacing: 0.15em;
  color: #b1c6cb;
}
.preview-flow {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 14px;
}
.preview-flow b {
  color: #d7ac67;
}
.preview-side small {
  color: #bacbd0;
}
.model-banner {
  display: flex;
  justify-content: space-between;
  gap: 18px;
  background: #eef3f5;
  border: 1px solid #d8e2e7;
  border-left: 4px solid #b99054;
  border-radius: 8px;
  padding: 20px 24px;
  margin-bottom: 22px;
  align-items: center;
}
.model-banner h2 {
  font-size: 23px;
  margin: 10px 0 5px;
}
.model-banner p {
  color: #637884;
  margin: 0;
}
.engineering-plot {
  display: block;
  width: 100%;
  height: auto;
  overflow: visible;
}
.engineering-plot text {
  fill: #637580;
  font-family: Inter, Arial, sans-serif;
  font-size: 11px;
}
.engineering-plot .plot-label {
  font-size: 11px;
  fill: #233c4b;
  font-weight: 600;
}
.plot-legend {
  display: flex;
  gap: 20px;
  flex-wrap: wrap;
  font-size: 11px;
  color: #617582;
  margin-bottom: 12px;
}
.plot-empty {
  min-height: 250px;
  display: grid;
  place-items: center;

        id === "scenario-temperature" ? "#temperature-value" : id === "scenario-chargeC" ? "#charge-value" : "#not-an-output"
      );
      if (out) out.textContent = value + (key === "temperature" ? " \xB0C" : " C");
      const button = document.querySelector("#ack-scope");
      if (button) button.disabled = true;
    }
    if (id === "support-text") {
      u.supportText = value;
      document.querySelector("#confirm-dialog").disabled = !value.trim();
    }
    if (id === "explicit-confirm") document.querySelector("#confirm-dialog").disabled = !el.checked;
    document.querySelectorAll('[data-action="go"]').forEach((button) => button.disabled = !allowed(s, +button.dataset.stage));
    if (manual && [
      "data-challenge",
      "evidence-size",
      "slice",
      "recipe",
      "scenario-chemistry",
      "scenario-protocol"
    ].includes(id))
      render();
    else drawGuide();
  }
  document.addEventListener("input", (e) => {
    if (e.target.tagName !== "SELECT") updateInput(e.target);
  });
  document.addEventListener("change", (e) => {
    if (e.target.tagName === "SELECT") updateInput(e.target);
  });
  document.addEventListener("click", (e) => {
    const el = e.target.closest("button");
    if (!el || el.disabled) return;
    if (el.dataset.start) {
      const [g, a2] = el.dataset.start.split(",").map(Number);
      return start(!!g, !!a2);
    }
    if (el.dataset.checkpoint) return start(true, true, +el.dataset.checkpoint, el.dataset.scenario);
    if (el.dataset.example) return fillExample(el.dataset.example);
    const a = el.dataset.action;
    if (!["show", "previous-action", "resume-action", "fill"].includes(a)) cancelFill();
    switch (a) {
      case "go":
        return go(+el.dataset.stage);
      case "previous-stage":
        return go(s.stage - 1);
      case "next-stage":
        return go(s.stage + 1);
      case "toggle-guidance":
        o.guided = !o.guided;
        return drawGuide();
      case "toggle-annotations":
        o.annotated = !o.annotated;
        return drawGuide();
      case "collapse":
        o.collapsed = !o.collapsed;
        return drawGuide();
      case "annotation-next":
        u.annotation++;
        return drawGuide();
      case "annotation-back":
        u.annotation = Math.max(0, u.annotation - 1);
        return drawGuide();
      case "previous-action":
        historyIndex = Math.max(0, historyIndex - 1);
        return drawGuide();
      case "resume-action":
        historyIndex = history.length - 1;
        return drawGuide();
      case "show":
        return highlight(true);
      case "fill":
        return instruction?.example && fillExample(instruction.example);
      case "stop-example":
        cancelFill();
        drawGuide();
        return notify("Example stopped. The partial draft remains editable.");
      case "restart":
        return confirmModal(
          "restart",
          "Restart this session?",
          "<p>Unsaved drafts, local receipts and session history will be cleared. Export a session report first if you want to keep them.</p>",
          "confirm-restart",
          "Restart"
        );
      case "confirm-restart":
        closeModal();
        s = fresh();
        u = freshUI();
        historyScope = "";
        return render();
      case "close":
        return closeModal();
      case "confirm-example": {
        const kind = u.pendingExample;
        closeModal();
        return fillExample(kind, true);
      }
      case "credits":
        return credits();
      case "method":
        return methodModal();
      case "protocol":
        return protocol();
      case "artifact":
        return artifact();
      case "activity":
        return activity();
      case "support":
        return support();
      case "save-support":
        if (run("support", { text: u.supportText })) {
          closeModal();
          notify("Preparation receipt recorded locally. Nothing was sent.");
        }
        return;
      case "connect":
        run("connect");
        break;
      case "save-mapping":
        run("mapping", u.mapping);
        break;
      case "select-intake":
        u.selected = el.dataset.id;
        historyScope = "";
        break;
      case "save-intake":
        run("intake", { id: u.selected, ...draft() });
        break;
      case "save-plan":
        run("plan", u.plan);
        break;
      case "save-objective":
        run("objective", u.objective);
        break;
      case "compare":
        run("compare");
        break;
      case "freeze-recipe":
        run("recipe", { kind: u.recipe, confirm: u.freezeConfirm });
        break;
      case "calibrate":
        run("calibrate", { confirm: u.calibrationConfirm });
        break;
      case "evaluate":
        run("evaluate");
        break;
      case "test-release":
        run("tests");
        break;
      case "test-receipts":
        return openModal("checks", "Release-check receipts", json(s.tests));
      case "attach":
        run("attach", { confirm: u.attachConfirm });
        break;
      case "select-cell":
        u.exampleSelected = el.dataset.id;
        u.workReceipt = [...s.receipts].reverse().find((r) => r.input_id === u.exampleSelected && r.artifact_id === s.run.artifact.id) || null;
        u.planText = u.planDrafts?.[u.exampleSelected] || "";
        break;
      case "work-tab":
        u.workTab = el.dataset.tab;
        break;
      case "predict":
        if (run("predict", { row: activeExample() })) {
          u.workReceipt = clone(s.receipts.at(-1));
          u.workTab = "interval";
        }
        break;
      case "save-note":
        if (run("note", { text: u.planText, action: u.planAction, inputId: activeExample().id }))
          notify("Separate test-plan note saved. No test was scheduled or stopped.");
        break;
      case "scenario-submit": {
        const r = scenarioRow(u.scenario, s.ids);
        if (run("predict", { row: r })) {
          u.scenarioReceipt = clone(s.receipts.at(-1));
          u.scenarioInputs = clone(u.scenario);
          u.scenarioDirty = false;
          u.scopeConfirm = false;
          s.scopeInspected = false;
        }
        break;
      }
      case "ack-scope":
        run("scope-inspected", {
          confirm: u.scopeConfirm && !!u.scenarioReceipt && !u.scenarioDirty
        });
        break;
      case "load-monitoring":
        run("monitor");
        break;
      case "arrive":
        run("arrive");
        break;
      case "change-model":
        run("change");
        break;
      case "changed-request":
        if (run("predict", { row: { ...s.data.monitoring[0], model: s.aliasTarget } }))
          u.changedReceipt = clone(s.receipts.at(-1));
        break;
      case "renew":
      case "renew-target":
        return confirmModal(
          "renew",
          "Archive and start a new evidence round?",
          `<p>Preserve this round\u2019s artifact, intake revisions, receipts and engineering notes. Start a fresh synthetic evidence pack for ${E2(s.versionEvent ? s.aliasTarget : s.ids.model)}. Method, target and release attachment must be chosen again.</p>`,
          "confirm-renew",
          "Archive & start new round"
        );
      case "confirm-renew":
        closeModal();
        s = newRound(s);
        u = freshUI();
        u.started = true;
        historyScope = "";
        render();
        window.scrollTo(0, 0);
        return;
      case "export-artifact":
        return download(`EyeTrustAI-Voltara-artifact-round-${s.round}.json`, s.run.artifact);
      case "export-evaluation":
        return download(`EyeTrustAI-Voltara-evaluation-round-${s.round}.json`, {
          artifact: s.run.artifact,
          metrics: s.evaluation,
          records: dataFor(s).evaluation.map((r) => ({
            id: r.id,
            cellId: r.cellId,
            lotId: r.lotId,
            temperature: r.temperature,
            chargeC: r.chargeC,
            point: r.point,
            reference: normalise(r),
            interval: interval(r, s.run),
            covered: includes(normalise(r), interval(r, s.run))
          }))
        });
      case "export-report":
        return download(`EyeTrustAI-Voltara-session-round-${s.round}.json`, report());
      default:
        return;
    }
    render();
  });
  dialog.addEventListener("cancel", (e) => {
    e.preventDefault();
    closeModal();
  });
  window.addEventListener("resize", () => {
    measure();
    highlight(false);
  });
  window.addEventListener("scroll", () => highlight(false), true);
  render();
})();
