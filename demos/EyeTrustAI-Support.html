/* OCT image-task workspace; original grayscale research cross-sections. */
.linden-mark {
  display: inline-grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 7px;
  color: white;
  background: #386f73;
  font-size: 17px;
}
.oct-image {
  position: absolute;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.plain-list {
  margin: 0;
  padding-left: 22px;
}
.plain-list li + li {

}

button.icon {

}
svg.icon {

  height: 19px;

  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;

}

  background: #1b2839;
  color: #a7b8cb;
  border-color: #2d3d50;
  height: 53px;
  padding: 0 20px;
}
.reading .topline b {
  color: #e5edf6;
}
.reading .topline button {
  background: #263b51;
  border-color: #45576d;
  color: #e0eaf4;
}
.reader-grid {
  display: grid;
  grid-template-columns: 205px minmax(0, 1fr) 355px;
  min-height: calc(100vh - var(--guide) - 53px);
  align-items: stretch;
}
.studylist {
  background: #1b2635;
  border-right: 1px solid #314056;
  padding: 15px 10px;
  color: #bfd0df;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.studylist .eyebrow {
  padding: 0 9px;
  color: #8eabc9;
}
.studylist input {
  font-size: 12px;
  padding: 8px;
  background: #142131;
  border-color: #36495d;
  color: #d1dfed;
  margin: 8px 0;
}
.study {
  display: block;
  text-align: left;
  padding: 13px 11px;
  color: #b6c7d8;
  background: transparent;
  border: 1px solid transparent;
  border-radius: 5px;
  font-size: 12px;
}
.study:hover:not(:disabled) {
  background: #23374c;
  border-color: #3c526a;
}
.study.current {
  background: #29415b;
  border-color: #567793;
  color: #fff;
}
.study span {
  display: block;
  font-size: 10px;
  color: #8fa6bd;
  margin-top: 4px;
}
.study.done:after {
  content: "Reference saved";
  display: block;
  color: #9ccbbd;
  font-size: 10px;
  margin-top: 5px;
}
.studylist .text {
  color: #a9c4e8;
  font-size: 12px;
  margin: 12px 0 0;
}
.view-shell {
  min-width: 0;
  background: #090e14;
  display: flex;
  flex-direction: column;
}
.viewer-toolbar {
  background: #1a2737;
  display: flex;
  align-items: center;
  gap: 7px;
  padding: 8px 12px;
  color: #b5c7dc;
  border-bottom: 1px solid #314055;
}
.viewer-toolbar button {
  padding: 6px 9px;
  background: #24374d;
  border-color: #354b65;
  color: #c2d3e6;
  font-size: 12px;
}
.viewer-toolbar span {
  margin-left: auto;
  font-size: 11px;
  color: #8299b1;
}
.viewport {
  height: clamp(340px, calc(100vh - var(--guide) - 236px), 760px);
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: grab;
  touch-action: none;
  background: #06090d;
  min-width: 0;
}
.viewport.dragging {
  cursor: grabbing;
}
.xray {
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center center;
}
.view-overlay {
  position: absolute;
  z-index: 2;
  left: 13px;
  top: 12px;
  color: #afc0d2;
  font:
    11px/1.7 ui-monospace,
    monospace;
  pointer-events: none;
  text-shadow: 0 1px 3px #000;
}
.view-overlay.bottom {
  top: auto;
  bottom: 12px;
  color: #798c9f;
}
.viewstrip {
  display: flex;
  gap: 10px;
  padding: 12px;
  background: #152130;
  border-top: 1px solid #293b50;
  overflow: auto;
}
.view-thumb {
  padding: 4px 7px;
  background: #1d2d41;
  border: 1px solid #3a4c63;
  color: #aebfd4;
  font-size: 10px;
  display: flex;
  gap: 8px;
}
.view-thumb.selected {
  border-color: #9cbedf;
  color: white;
  background: #2c435e;
}
.view-thumb img {
  width: 46px;
  height: 52px;
  object-fit: contain;
  background: #000;
}
.reader-task {
  background: #fbfcfd;
  border-left: 1px solid #324456;
  min-width: 0;
  padding-bottom: 15px;
}
.task-heading {
  padding: 19px 22px;
  border-bottom: 1px solid var(--line);
}
.task-heading h2 {
  margin: 5px 0;
  font-size: 17px;
}
.taskbody {
  padding: 20px;
}
.taskbody label {
  font-size: 13px;
}
.taskbody .outcomes {
  grid-template-columns: 1fr;
}
.taskbody .notice {
  font-size: 12px;
  padding: 12px;
  margin: 16px 0;
}
.taskbody .fields {
  grid-template-columns: 1fr;
}
.taskactions {
  padding: 15px 20px;
  border-top: 1px solid var(--line);
  display: grid;
  gap: 9px;
}
.taskactions button {
  width: 100%;
  font-size: 13px;
}
.research-note {
  padding: 12px 17px;
  color: #8da1b9;
  background: #152130;
  font-size: 11px;
  border-top: 1px solid #2d3f53;
}
.finding-card {
  padding: 15px;
  background: #f0f4fa;
  border: 1px solid #d5dfec;
  border-radius: 6px;
  margin: 12px 0;
}
.finding-card h3 {
  color: #435e80;
  font-size: 15px;
  margin-bottom: 7px;
}
.finding-card p {
  font-size: 12px;
  color: #667993;
}
.mini-image {
  width: 95px;
  height: 110px;
  object-fit: contain;
  background: #101923;
  border-radius: 3px;
}
.empty {
  text-align: center;
  padding: 32px;
  color: var(--muted);
  font-size: 14px;
}
#pointer {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 70;
}
#pointer .highlight {
  position: absolute;
  border: 2px solid #567fb2;
  border-radius: 6px;
  box-shadow: 0 0 0 3px #ffffffa8;
}
#pointer .arrow {
  position: absolute;
  font-size: 28px;
  line-height: 1;
  color: #567fb2;
  text-shadow: 0 1px 2px white;
}
#toast {
  position: fixed;
  right: 24px;
  bottom: 88px;
  z-index: 150;
  background: #2d4358;
  color: white;
  max-width: 420px;
  padding: 13px 17px;
  border-radius: 7px;
  box-shadow: 0 5px 25px #0002;
  font-size: 13px;
  display: none;
}
#toast.visible {
  display: block;
}
dialog {
  padding: 0;
  border: 1px solid #d0d8e2;
  border-radius: 10px;
  width: min(680px, calc(100vw - 32px));
  max-height: 82vh;
  color: var(--ink);
  box-shadow: 0 20px 90px #17243833;
}
dialog::backdrop {
  background: #12203566;
}
dialog .dialog-body {
  padding: 25px;
  overflow: auto;
  max-height: calc(82vh - 140px);
}
dialog header {
  padding: 19px 24px;
  border-bottom: 1px solid var(--line);
  display: flex;
  align-items: center;
  justify-content: space-between;
}
dialog footer {
  padding: 16px 24px;
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  background: #fff;
}
dialog p {
  font-size: 14px;
}
dialog .field {
  margin-top: 17px;
}
dialog h3 {
  margin: 19px 0 7px;
}
dialog pre {
  white-space: pre-wrap;
  font-size: 11px;
}
[hidden] {
  display: none !important;
}
@media (min-width: 951px) {
  .reader-grid {
    height: max(340px, calc(100dvh - var(--guide) - 53px));
    min-height: 0;
    overflow: hidden;
  }
  .studylist {
    overflow-y: auto;
    min-height: 0;
  }
  .view-shell {
    display: flex;
    flex-direction: column;
    min-height: 0;
  }

    flex: 1;
    height: auto;
    min-height: 200px;
  }
  .viewer-toolbar,
  .viewstrip,
  .research-note {

  .reader-task {
    display: flex;

  }
  .annotation p {
    display: none;
  }

    margin: 5px 0;
  }
  .annotation .row {
    margin-top: 4px;
  }

  }

  }

  content: "";

  right: 0;
  top: -3px;

  top: 50%;
  height: 1px;

  .source-card .kv strong {

    grid-template-columns: 218px minmax(280px, 1fr) 265px;
  }

    grid-template-columns: 1fr;
  }

  .conversation-head,
  .thread {
    padding: 18px;

  .proposal,
  .guard-strip,
  .assessment,

    margin: 16px;
  }
  .context-panel {
    padding: 18px 13px;
  }
  .inbox-header {

  }
  .ticket {
    padding: 12px 10px;

  }
  .test-grid {

  }
  .context-panel {
    grid-column: 2;
    border-top: 1px solid var(--line);
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;

    grid-column: 1/-1;

  .inbox {
    grid-row: 1/3;
  }
  .desk .sidebar {
    width: 62px;
  }
  .desk .main {
    margin-left: 62px;
  }
  .context-panel .notice {
    grid-column: 1/-1;
  }
  .desk .topline {
    padding: 12px;
  }
  .metrics {
    grid-template-columns: 1fr 1fr 1fr;
  }

@media (max-width: 700px) {
  .desk .sidebar {
    display: none;
  }
  .desk .main {
    margin-left: 0;
  }
  .desk-layout {
    display: block;
  }
  .desk-mobile-nav {
    display: flex;
    gap: 5px;
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
    background: #fff;
  }
  .desk-mobile-nav button {
    flex: 1;
    font-size: 12px;
    padding: 8px;
  }
  .desk-mobile-nav button.active {
    background: #e9f3f0;
    border-color: #a4c2b8;
  }
  .desk-layout .inbox,
  .desk-layout .conversation,
  .desk-layout .context-panel {
    display: none;

  .desk-layout[data-pane="queue"] .inbox,
  .desk-layout[data-pane="context"] .context-panel {

  }
  .context-panel {
    border-left: 0;
    min-height: 450px;
  }
  .inbox {
    border-right: 0;
  }
  .metrics {
    grid-template-columns: 1fr;
  }
  .test-grid {
    grid-template-columns: 1fr;
  }
  .assessment .fields {
    grid-template-columns: 1fr;
  }
  .assessment .full {
    grid-column: 1;
  }
  .editor-toolbar {
    flex-wrap: wrap;
  }
  .node-inspector {
    grid-template-columns: 1fr;
  }
  .node-inspector .kv {
    margin: 0;
    padding: 5px 0;
  }
  .flow-canvas {
    padding: 20px 12px 35px;
  }
  .flow-track {
    min-width: 530px;
  }
  .intro h1 {
    font-size: 30px;
  }
  .conversation-head h2 {
    font-size: 17px;
  }
  .desk .topline {
    display: block;
  }
  .desk .topline .row {
    margin-top: 8px;
  }
  .composer-footer {
    flex-wrap: wrap;
  }
  .simulation {
    font-size: 10px;
  }
  .source-card p {
    font-size: 14px;
  }
  .source-card .kv strong {
    font-size: 14px;
  }
}
