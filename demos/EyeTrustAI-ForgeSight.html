/* OCT image-task workspace; original grayscale research cross-sections. */
.linden-mark {
  display: inline-grid;
  place-items: center;
  width: 27px;
  height: 27px;
  border-radius: 7px;
  color: white;
  background: #386f73;
  font-size: 17px;
}
.oct-image {
  position: absolute;
  width: 100%;
  height: 100%;
  max-width: 100%;
  max-height: 100%;
  object-fit: contain;
  user-select: none;
  pointer-events: none;
  transform-origin: center;
}
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip-path: inset(50%);
  white-space: nowrap;
}
.plain-list {
  margin: 0;
  padding-left: 22px;
}
.plain-list li + li {

}

button.icon {

}
svg.icon {

  height: 19px;

  stroke-width: 1.6;
  stroke-linecap: round;
  stroke-linejoin: round;

}

}

}
.finding-card {

  border-radius: 6px;

}
.finding-card h3 {
  color: #435e80;
  font-size: 15px;
  margin-bottom: 7px;
}
.finding-card p {
  font-size: 12px;
  color: #667993;
}
.mini-image {
  width: 95px;
  height: 110px;
  object-fit: contain;
  background: #101923;
  border-radius: 3px;
}
.empty {
  text-align: center;
  padding: 32px;
  color: var(--muted);
  font-size: 14px;
}
#pointer {
  pointer-events: none;
  position: fixed;
  inset: 0;
  z-index: 70;
}
#pointer .highlight {
  position: absolute;
  border: 2px solid #567fb2;
  border-radius: 6px;
  box-shadow: 0 0 0 3px #ffffffa8;
}
#pointer .arrow {
  position: absolute;
  font-size: 28px;
  line-height: 1;
  color: #567fb2;
  text-shadow: 0 1px 2px white;
}
#toast {
  position: fixed;
  right: 24px;
  bottom: 88px;
  z-index: 150;
  background: #2d4358;
  color: white;

  padding: 13px 17px;
  border-radius: 7px;
  box-shadow: 0 5px 25px #0002;

  display: none;
}
#toast.visible {
  display: block;
}
dialog {
  padding: 0;
  border: 1px solid #d0d8e2;
  border-radius: 10px;

}
dialog .field {

}
dialog h3 {
  margin: 19px 0 7px;
}

}
[hidden] {
  display: none !important;
}

        go(+el.dataset.stage);
        break;
      case "previous-stage":
        go(s.stage - 1);
        break;
      case "next-stage":
        go(s.stage + 1);
        break;
      case "toggle-guidance":
        o.guided = !o.guided;
        drawGuide();
        break;
      case "toggle-annotations":
        o.annotated = !o.annotated;
        drawGuide();
        break;
      case "collapse":
        o.collapsed = !o.collapsed;
        drawGuide();
        break;
      case "annotation-next":
        u.annotation++;
        drawGuide();
        break;
      case "annotation-back":
        u.annotation = Math.max(0, u.annotation - 1);
        drawGuide();
        break;
      case "previous-action":
        historyIndex = Math.max(0, historyIndex - 1);
        drawGuide();
        break;
      case "resume-action":
        historyIndex = history.length - 1;
        drawGuide();
        break;
      case "show":
        highlight(true);
        break;
      case "fill":
        fillExample(instruction.example);
        break;
      case "stop-example":
        cancelFill();
        drawGuide();
        notify("Example filling stopped. Your current draft remains editable.");
        break;
      case "connect":
        if (!s.connected) run("connect");
        go(1);
        break;
      case "save-mapping":
        if (run("mapping", u.mapping)) {
          render();
          notify("Mapping saved. Original part identity retained.");
        }
        break;
      case "restore-source":
        u.mapping.source = "full";
        render();
        break;
      case "repair-data":
        u.plan.challenge = "clean";
        s.dataReady = false;
        render();
        notify("Restored the original synthetic population pack. Review and save its roles.");
        break;
      case "save-data":
        if (run("data", u.plan)) {
          render();
          notify("Protected data roles saved.");
        }
        break;
      case "select-review":
        u.selected = el.dataset.id;
        u.reviewTab = "image";
        historyScope = "";
        render();
        break;
      case "review-tab":
        u.reviewTab = el.dataset.tab;
        render();
        break;
      case "save-reference":
        if (run("reference", { id: u.selected, ...draft() })) {
          render();
          notify("Review practice saved separately; score cohorts unchanged.");
        }
        break;
      case "finish-review":
        if (run("review-done")) go(4);
        break;
      case "objective-reviewed":
        u.objectiveReviewed = true;
        render();
        break;
      case "save-objective":
        if (run("objective", u.objective)) {
          u.objectiveDirty = false;
          render();
          notify("Objective saved for this round.");
        }
        break;
      case "run-calibration":
        if (run("calibrate", { confirm: u.freezeConfirm })) {
          render();
          notify("Order statistic calculated and inputs frozen.");
        }
        break;
      case "evaluate":
        if (run("evaluate")) go(6);
        break;
      case "select-example":
        u.exampleSelected = el.dataset.id;
        render();
        break;
      case "explored":
        if (run("explored")) go(8);
        break;
      case "run-tests":
        if (run("tests")) render();
        break;
      case "attach-release":
        if (run("attach", { confirm: u.attachConfirm })) {
          render();
          notify("Attached to the local demonstration preview.");
        }
        break;
      case "submit-input": {
        const row = previewExample(), override = u.previewScenario === "scores" ? { scores: null } : u.previewScenario === "scope" ? { inScope: false } : u.previewScenario === "model" ? { model: "different-model" } : u.previewScenario === "camera" ? { acquisition: "different-camera" } : {};
        const payload = envelope(s, row, override);
        if (run("submit", { row: payload })) {
          u.previewReceipt = s.receipts.at(-1);
          u.lastSubmittedTop = top(payload);
          render();
        }
        break;
      }
      case "preview-mode":
        u.previewMode = el.dataset.mode;
        render();
        break;
      case "simulate-change":
        if (run("change", { kind: u.change })) {
          u.changedReceipt = null;
          render();
        }
        break;
      case "test-changed": {
        const row = envelope(
          s,
          previewExample(),
          s.versionEvent === "model" ? { model: `housing-classifier-v${Number(s.ids.model.match(/v(\d+)$/)[1]) + 1}` } : { acquisition: `top-camera-B-r${s.round + 1}` }
        );
        if (run("submit", { row })) {
          u.changedReceipt = s.receipts.at(-1);
          render();
        }
        break;
      }
      case "new-round":
        confirmModal(
          "round",
          "Archive this round and prepare a new one?",
          `<p>Round ${s.round} and its frozen artifact, review practice, results and receipts remain in the local archive. The next round starts with fresh synthetic evidence identities and no attached release.</p><p>Revisit the population and sampling plan before the next calculation. No production recalibration occurs.</p>`,
          "confirm-round",
          "Begin new round"
        );
        break;
      case "confirm-round":
        if (document.querySelector("#explicit-confirm").checked) {
          closeModal();
          s = newRound(s);
          u = freshUI();
          u.started = true;
          u.objective.population = `Meridian connector housings \xB7 ${s.ids.acquisition} \xB7 appearance-v1`;
          historyScope = "";
          render();
          window.scrollTo(0, 0);
        }
        break;
      case "protocol":
        protocol2();
        break;
      case "credits":
        credits();
        break;
      case "method":
        openModal("method", "Method & assumptions", methodDetails());
        break;
      case "source-details":
        sourceDetails();
        break;
      case "support":
        support();
        break;
      case "save-support":
        if (run("support", { text: `${u.supportType}: ${u.supportText}` })) {
          const receipt = s.requests.at(-1);
          u.supportText = "";
          closeModal();
          openModal(
            "support-receipt",
            "Local case recorded",
            `${kv("Case", receipt.id)}${kv("Status", receipt.status)}<p class="gap">${E(receipt.text)}</p>`
          );
        }
        break;
      case "activity":
        activity();
        break;
      case "export-artifact":
        exportFile(`ForgeSight-${s.run.artifact.id}.json`, releasePackage());
        break;
      case "export-data":
        exportFile(`ForgeSight-score-cohorts-r${s.round}.json`, {
          demo: true,
          provenance: "FS-DATA-1 seeded synthetic records",
          identities: s.ids,
          data: dataFor(s)
        });
        break;
      case "export-report":
        exportFile(`ForgeSight-session-r${s.round}.json`, {
          demo: true,
          round: s.round,
          release: s.run && s.evaluation ? releasePackage() : s.run?.artifact || null,
          references: s.references,
          referenceHistory: s.referenceHistory,
          receipts: s.receipts,
          archives: s.archives,
          activity: s.log
        });
        break;
      case "zoom-in":
        viewportState().zoom = Math.min(5, viewportState().zoom + 0.25);
        updateImage();
        break;
      case "zoom-out":
        viewportState().zoom = Math.max(0.25, viewportState().zoom - 0.25);
        updateImage();
        break;
      case "fit":
        Object.assign(viewportState(), { zoom: 1, x: 0, y: 0 });
        updateImage();
        break;
      case "native": {
        const box = document.querySelector("#viewport").getBoundingClientRect();
        Object.assign(viewportState(), {
          zoom: 1 / Math.min(box.width / 720, box.height / 520),
          x: 0,
          y: 0
        });
        updateImage();
        break;
      }
      case "confirm-example": {
        const kind = u.pendingExample;
        closeModal();
        fillExample(kind, true);
        break;
      }
      case "restart":
        confirmModal(
          "restart",
          "Return to the experience chooser?",
          "<p>This clears this browser session\u2019s work and archive. Export the session report first if you want to keep it.</p>",
          "confirm-restart",
          "Return to chooser"
        );
        break;
      case "confirm-restart":
        if (document.querySelector("#explicit-confirm").checked) {
          closeModal();
          s = fresh();
          u = freshUI();
          historyScope = "";
          render();
          window.scrollTo(0, 0);
        }
        break;
      case "close":
        closeModal();
        break;
    }
  });
  dialog.addEventListener("cancel", (e) => {
    e.preventDefault();
    closeModal();
  });
  window.addEventListener("resize", () => {
    measure();
    updateImage();
    highlight(false);
  });
  document.addEventListener("scroll", () => highlight(false), true);
  render();
})();
