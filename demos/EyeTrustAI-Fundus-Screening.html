          `<p>Save the working grade for <strong>${u.selected}</strong>. This does not sign off a patient, send a report or create a referral letter.</p>${kv("Entry", assessed(draft()) ? `DR ${draft().dr} / macular-edema risk ${draft().me}` : E(draft().status))}`,
          "confirm-complete",
          "Complete local task"
        );
        break;
      case "confirm-complete":
        if (run("complete", {
          id: u.selected,
          ...draft(),
          confirm: document.querySelector("#explicit-confirm").checked
        })) {
          closeModal();
          render();
        }
        break;
      case "version-change":
        run("suspend");
        render();
        break;
      case "pause":
        run("suspend", { manual: true });
        render();
        break;
      case "continued-collection":
        confirmModal(
          "round",
          "Plan continued collection?",
          `<p>Begin a new local round, retaining the previous round in the archive. Reconfirm compatible settings and collect further references. No automatic reassessment is performed.</p>`,
          "confirm-round",
          "Begin new round"
        );
        break;
      case "new-round":
        confirmModal(
          "round",
          "Start a new evidence round?",
          `<p>The previous configuration, references, working grades and policy are retained in the local archive. Routine permission is not carried forward.</p>`,
          "confirm-round",
          "Begin new round"
        );
        break;
      case "confirm-round":
        if (document.querySelector("#explicit-confirm").checked) {
          closeModal();
          s = newRound(s);
          const started = u.started;
          u = freshUI();
          u.started = started;
          historyScope = "";
          render();
        }
        break;
      case "adjudicate":
        u.adjudicateId = el.dataset.id;
        openModal(
          "adjudicate",
          "Separate reference adjudication",
          `<p>${u.adjudicateId} \xB7 Assigned to ${E(s.plan.adjudicator)}, not the original grader.</p><p class="smalltext gap">Original unresolved reason: ${E(s.labels[u.adjudicateId].reason)}</p><div class="fields gap">${field("DR grade", "adj-dr", select("adj-dr", [["", "Select grade"], ...drNames.map((t, i) => [i, t])], ""))}${field("Macular-edema risk", "adj-me", select("adj-me", [["", "Select grade"], ...meNames.map((t, i) => [i, t])], ""))}</div><label class="checkrow gap"><input id="explicit-confirm" type="checkbox">Record this separate practice adjudication.</label>`,
          "save-adjudication",
          "Save adjudication"
        );
        document.querySelector("#confirm-dialog").disabled = true;
        break;
      case "save-adjudication": {
        const dr = document.querySelector("#adj-dr").value, me = document.querySelector("#adj-me").value;
        if (run("adjudicate", {
          id: u.adjudicateId,
          status: "assessed",
          dr: dr === "" ? "" : Number(dr),
          me: me === "" ? "" : Number(me),
          confirm: document.querySelector("#explicit-confirm").checked
        })) {
          closeModal();
          render();
        }
        break;
      }
      case "support":
        support();
        break;
      case "save-support":
        if (run("support", { reason: `${u.supportType || "preparation"}: ${u.supportText || ""}` })) {
          u.supportText = "";
          closeModal();
          render();
          notify("Local support case recorded. Nothing was sent.");
        }
        break;
      case "audit-example":
        u.selected = "FG-006";
        u.filter = "all";
        go(9);
        break;
      case "credits":
        credits();
        break;
      case "protocol":
        protocol();
        break;
      case "source-details":
        sourceDetails();
        break;
      case "activity":
        activity();
        break;
      case "receipt":
        receipt();
        break;
      case "zoom-in":
        viewportState().zoom = Math.min(5, viewportState().zoom + 0.25);
        updateImage();
        break;
      case "zoom-out":
        viewportState().zoom = Math.max(1, viewportState().zoom - 0.25);
        updateImage();
        break;
      case "fit":
        Object.assign(viewportState(), { zoom: 1, x: 0, y: 0 });
        updateImage();
        break;
      case "confirm-example": {
        const kind = u.pendingExample;
        closeModal();
        fillExample(kind, true);
        break;
      }
      case "restart":
        confirmModal(
          "restart",
          "Restart the walkthrough?",
          `<p>This clears this browser session\u2019s drafts, practice records and local archive. The images, source grades and all other demos are unchanged.</p>`,
          "confirm-restart",
          "Return to experience chooser"
        );
        break;
      case "confirm-restart":
        if (document.querySelector("#explicit-confirm").checked) {
          closeModal();
          s = fresh();
          u = freshUI();
          historyScope = "";
          render();
        }
        break;
      case "close":
        closeModal();
        break;
    }
  });

  // Restore the originating control after the demo redraws its toolbar.
  var websiteDialogOpener = null;
  document.addEventListener("click", (event) => {
    const control = event.target.closest("button, a, [role=button]");
    if (control && !dialog.contains(control)) {
      websiteDialogOpener = {node: control, id: control.id, action: control.getAttribute("data-action")};
    }
  }, true);
  dialog.addEventListener("close", () => setTimeout(() => {
    if (dialog.open || document.activeElement !== document.body) return;
    const previous = websiteDialogOpener;
    const replacement = previous?.node.isConnected ? previous.node
      : (previous?.id ? document.getElementById(previous.id) : null)
        || (previous?.action ? [...document.querySelectorAll("[data-action]")].find(el => el.getAttribute("data-action") === previous.action) : null)
        || document.querySelector(".website-demo-nav a");
    replacement?.focus({preventScroll: true});
  }, 0));
  dialog.addEventListener("cancel", () => {
    u.modal = null;
    cancelFill();
    setTimeout(drawGuide, 0);
  });
  window.addEventListener("resize", () => {
    measure();
    highlight(false);
  });
  document.addEventListener("scroll", () => highlight(false), true);
  render();
})();
